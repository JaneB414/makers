ntListener(\"click\", function () { $(\"confirm-clear\").hidden = true; });\n    $(\"clear-yes\").addEventListener(\"click\", function () {\n      state.problems = []; saveState(); renderPages(); $(\"confirm-clear\").hidden = true;\n    });\n  }\n\n  init();\n})();\n<\/script>\n<\/body>\n<\/html>\n", "workbook": "<!doctype html>\n<html lang=\"ko\">\n<head>\n<script>\n// 영어 메이커 안의 탭(iframe)에서 Claude 화면 기능(AI 만들기, 파일 저장)을 쓰게 하는 다리.\n// 탭은 바깥 페이지와 같은 출처라서 바깥의 window.claude를 빌려 쓴다.\n// AbortSignal·Blob은 바깥 창에서 다시 만들어 넘긴다(창이 다르면 같은 종류로 알아보지 못할 수 있다).\n(function () {\n  var outer;\n  try { outer = window.parent !== window ? window.parent : null; } catch (e) { outer = null; }\n  if (!outer || window.claude) return;\n  var claude;\n  try { claude = outer.claude; } catch (e) { return; }\n  if (!claude || typeof claude.use !== \"function\") return;\n\n  function outerOptions(opts) {\n    if (!opts || !opts.signal) return opts;\n    var c = new outer.AbortController();\n    if (opts.signal.aborted) c.abort();\n    else opts.signal.addEventListener(\"abort\", function () { c.abort(); });\n    var copy = {};\n    Object.keys(opts).forEach(function (k) { copy[k] = opts[k]; });\n    copy.signal = c.signal;\n    return copy;\n  }\n\n  function wrap(name, ns) {\n    if (!ns) return ns;\n    if (name === \"sample\") {\n      var f = function (input, opts) { return ns(input, outerOptions(opts)); };\n      f.json = function (input, opts) { return ns.json(input, outerOptions(opts)); };\n      if (typeof ns.limits === \"function\") f.limits = function () { return ns.limits(); };\n      return f;\n    }\n    if (name === \"downloads\") {\n      return {\n        save: function (arg) {\n          var data = arg.data;\n          if (data instanceof Blob) data = new outer.Blob([data], { type: data.type });\n          return ns.save({ filename: arg.filename, data: data });\n        }\n      };\n    }\n    return ns;\n  }\n\n  window.claude = { use: function (name) { return claude.use(name).then(function (ns) { return wrap(name, ns); }); } };\n})();\n<\/script>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>영어 워크북 메이커<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap\">\n<style>\n/* 레이아웃: 왼쪽 작업대(보관함·유형·만들기), 오른쪽 A4 쪽 미리보기. 좁은 화면에서는 위아래로 쌓인다.\n   시험지(.page)는 인쇄물이라 화면 테마와 상관없이 흰 종이에 검은 글씨로 그린다. */\n:root {\n  --bg: #f6f7f9;\n  --fg: #1d2230;\n  --muted: #5d6475;\n  --line: #d9dce2;\n  --panel: #ffffff;\n  --field: #fbfbfc;\n  --accent: #1d3a6b;\n  --accent-ink: #ffffff;\n  --accent-soft: #e6ecf6;\n  --err: #b3261e;\n  --ok: #1e6b47;\n  --warn: #8a5a00;\n\n  /* 시험지 (시안 A) */\n  --paper: #ffffff;\n  --ink: #111111;\n  --navy: #1d3a6b;\n  --src-gray: #6b7688;\n  --box-fill: #eef2f8;\n  --col-rule: #c9d1de;\n  --tag-fill: #e3eaf5;\n  --foot-gray: #555555;\n  --en: \"Times New Roman\", Times, \"Liberation Serif\", \"Nimbus Roman\", serif;\n  --kr-serif: \"Noto Serif KR\", \"함초롬바탕\", \"HCR Batang\", \"Batang\", serif;\n  --kr-sans: \"IBM Plex Sans KR\", \"함초롬돋움\", \"HCR Dotum\", \"Malgun Gothic\", sans-serif;\n  --ui: \"IBM Plex Sans KR\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", sans-serif;\n  --radius: 6px;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #14171e; --fg: #e6e8ee; --muted: #9aa1b2; --line: #2d3240; --panel: #1b1f28; --field: #151920;\n    --accent: #8fb0ea; --accent-ink: #0e1422; --accent-soft: #24304a; --err: #f08a80; --ok: #6cc79a; --warn: #e0b35a;\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #14171e; --fg: #e6e8ee; --muted: #9aa1b2; --line: #2d3240; --panel: #1b1f28; --field: #151920;\n  --accent: #8fb0ea; --accent-ink: #0e1422; --accent-soft: #24304a; --err: #f08a80; --ok: #6cc79a; --warn: #e0b35a;\n  color-scheme: dark;\n}\n\n* { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--ui); }\n.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }\n\nheader.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 18px; }\nheader.top h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; text-wrap: balance; }\nheader.top p { margin: 0; color: var(--muted); font-size: 14px; }\n\n.layout { display: grid; grid-template-columns: minmax(0, 450px) minmax(0, 1fr); gap: 24px; align-items: start; }\n@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }\n\n.stack { display: grid; gap: 16px; min-width: 0; }\n.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }\n.panel h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }\n.step { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; }\n\nlabel.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }\n.grow { flex: 1 1 180px; }\ninput[type=\"text\"], textarea, select { width: 100%; font: inherit; font-size: 14px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; }\ntextarea { resize: vertical; font-family: var(--en); font-size: 15px; line-height: 1.6; }\ntextarea.mono { font-family: ui-monospace, \"SF Mono\", Menlo, monospace; font-size: 12px; }\ninput:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, .button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }\n\n.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }\n.row.end { margin-left: auto; }\n.hint { font-size: 12.5px; color: var(--muted); margin: 0; }\n.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; }\ncode { font-size: 12px; background: var(--accent-soft); padding: 0 4px; border-radius: 3px; }\n\nbutton, .button { font: inherit; font-size: 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 7px 12px; cursor: pointer; display: inline-block; }\nbutton:hover, .button:hover { border-color: var(--accent); }\nbutton.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }\nbutton:disabled { opacity: 0.5; cursor: default; }\nbutton.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; text-decoration: underline; font-size: 13px; }\n\ndetails > summary { cursor: pointer; font-size: 13.5px; color: var(--muted); }\ndetails .sub { display: grid; gap: 8px; margin-top: 8px; }\n.grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; }\n@media (max-width: 480px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }\n\n/* 지문 번호 칩 */\n.chips-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }\n.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }\n.chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; font-size: 13px; font-variant-numeric: tabular-nums; }\n.chip input { margin: 0 0 0 9px; }\n.chip button { border: 0; border-radius: 0; background: none; padding: 4px 10px 4px 6px; font-size: 13px; }\n.chip.checked { border-color: var(--accent); background: var(--accent-soft); }\n.chip.editing button { font-weight: 700; text-decoration: underline; }\n.chips .empty-chip { font-size: 13px; color: var(--muted); }\n.row.between { justify-content: space-between; align-items: center; }\n.chip.plain button { padding: 4px 10px; }\n.picker { display: grid; gap: 6px; max-height: 360px; overflow: auto; }\n.pick-group { border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }\n.pick-group[open] { padding-bottom: 10px; }\n.pick-group > summary { display: flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 600; list-style: none; }\n.pick-group > summary::-webkit-details-marker { display: none; }\n.pick-group > summary::before { content: \"▸\"; color: var(--muted); font-size: 12px; }\n.pick-group[open] > summary::before { content: \"▾\"; }\n.pick-group > summary .n { font-weight: 400; color: var(--muted); font-size: 12.5px; }\n.pick-group .chips { margin-top: 8px; }\n.editor { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px; }\n\n/* 유형 */\n.types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }\n@media (max-width: 420px) { .types { grid-template-columns: minmax(0, 1fr); } }\n.type { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font-size: 13.5px; }\n.type.on { border-color: var(--accent); background: var(--accent-soft); }\n.type input[type=\"number\"] { width: 46px; font: inherit; padding: 2px 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; }\n.tag { font-size: 10.5px; letter-spacing: 0.04em; padding: 1px 5px; border-radius: 3px; border: 1px solid currentColor; margin-left: 4px; }\n.tag.auto { color: var(--ok); }\n.tag.ai { color: var(--accent); }\n\n.sentences { max-height: 180px; overflow: auto; margin: 6px 0; padding-left: 22px; font-family: var(--en); font-size: 13.5px; }\n\n.msg { font-size: 13.5px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--line); }\n.msg.err { color: var(--err); border-color: var(--err); }\n.msg.ok { color: var(--ok); border-color: var(--ok); }\n.msg.warn { color: var(--warn); border-color: var(--warn); }\n.ai-out, .prompts { display: grid; gap: 8px; }\n.prompt-item { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }\n\n.sheet-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }\n\n/* ===== 시험지 쪽 (A4: 794 × 1123 px) ===== */\n.pages-scroll { overflow: hidden; }\n.pages { display: grid; gap: 20px; transform-origin: top left; width: 794px; }\n.page { position: relative; width: 794px; height: 1123px; background: var(--paper); color: var(--ink); padding: 38px 57px 36px; display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(0,0,0,.14), 0 8px 24px rgba(0,0,0,.06); font-family: var(--en), var(--kr-serif); font-size: 13.33px; line-height: 1.65; }\n.p-header { display: flex; justify-content: space-between; gap: 16px; font: 10.67px/1.4 var(--kr-sans); color: var(--foot-gray); border-bottom: 1px solid #999; padding-bottom: 4px; margin-bottom: 14px; }\n.p-top { margin-bottom: 18px; }\n.p-body { flex: 1; min-height: 0; display: grid; gap: 0 26px; }\n.p-body.two { grid-template-columns: 1fr 1fr; background: linear-gradient(var(--col-rule), var(--col-rule)) center / 1px 100% no-repeat; }\n.col { min-width: 0; overflow: hidden; height: 100%; }\n.p-footer { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; font: 10.67px/1.4 var(--kr-sans); color: var(--foot-gray); border-top: 1px solid var(--navy); padding-top: 6px; margin-top: 12px; }\n.p-footer span:last-child { text-align: right; }\n\n.page p { margin: 0; }\n.page .k-eyebrow { font: 700 11.33px/1.4 var(--kr-sans); color: var(--navy); letter-spacing: .12em; }\n.page .k-title { font: 700 24px/1.3 var(--en), var(--kr-serif); letter-spacing: -0.01em; }\n.page .k-nameLine { text-align: right; font: 12px/1.4 var(--kr-sans); border-bottom: 2.6px solid var(--navy); padding-bottom: 7px; min-height: 26px; }\n.page .k-src { font: 700 10.67px/1.3 var(--kr-sans); color: var(--src-gray); margin: 18px 0 1px 27px; letter-spacing: .03em; }\n.page .k-ask { display: grid; grid-template-columns: 27px minmax(0, 1fr); align-items: baseline; font: 700 13.33px/1.5 var(--kr-sans); margin-bottom: 5px; position: relative; }\n.page .k-ask.first { margin-top: 18px; }\n.page .k-ask .r-num { font: 700 17.33px/1 var(--en); color: var(--navy); }\n.page .k-para { text-align: justify; hyphens: auto; }\n.page .k-box { background: var(--box-fill); padding: 1px 9px; text-align: justify; }\n.page .k-box.first { padding-top: 6px; margin-top: 4px; }\n.page .k-box.last { padding-bottom: 6px; margin-bottom: 6px; }\n.page .k-choice { padding-left: 1.35em; text-indent: -1.35em; line-height: 1.55; }\n.page .k-choice.first { margin-top: 6px; }\n.page .k-answerLine { margin: 6px 0 0 27px; }\n.page .k-ansTitle { font: 700 18.67px/1.4 var(--en), var(--kr-serif); text-align: center; margin-bottom: 10px; }\n.page .k-roundTitle { font: 700 18.67px/1.4 var(--en), var(--kr-serif); text-align: center; color: var(--navy); margin: 4px 0 2px; }\n.page .k-typeHead { font: 700 14px/1.4 var(--kr-sans); color: var(--navy); border-bottom: 1.3px solid var(--navy); padding-bottom: 3px; margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; }\n.page .k-typeHead:first-child { margin-top: 2px; }\n.page .r-typeRange { font: 400 10.67px var(--kr-sans); color: var(--src-gray); letter-spacing: .02em; }\n.page .r-tag { display: inline-block; font: 700 10.67px/1.5 var(--kr-sans); color: var(--navy); background: var(--tag-fill); padding: 0 2px; margin-left: 2px; border-radius: 2px; white-space: nowrap; vertical-align: 1px; }\n.p-full:empty { display: none; }\n.p-full { margin-bottom: 12px; }\n.page .answer-grid { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }\n.page .answer-grid td { border: 1px solid #aeb6c4; text-align: center; padding: 2px 0; line-height: 1.35; }\n.page .answer-grid .g-num { background: #eef1f6; font: 11.33px var(--kr-sans); color: #333; width: 4.5%; }\n.page .answer-grid .g-ans { font: 12.67px var(--en), var(--kr-serif); width: 5.5%; }\n.page .k-gridCaption { font: 700 12.67px/1.4 var(--kr-sans); color: var(--navy); margin: 8px 0 2px; }\n.page .answer-table { border-collapse: collapse; margin: 6px 0 2px; width: 100%; table-layout: fixed; }\n.page .answer-table th, .page .answer-table td { border: 1px solid #aeb6c4; text-align: center; font: 10.67px/1.4 var(--kr-sans); }\n.page .answer-table th { background: #eef1f6; color: #333; font-weight: 400; padding: 3px 2px; }\n.page .answer-table th:first-child { width: 22%; }\n.page .answer-table td { height: 26px; }\n.page .k-ans { font-size: 12.67px; line-height: 1.5; padding-left: 1.8em; text-indent: -1.8em; margin-bottom: 2px; }\n.page .r-ansNum { color: var(--navy); font-weight: 700; }\n.page .r-explain { color: #444; font-size: 11.33px; }\n.page .tools { position: absolute; right: 0; top: -2px; display: flex; gap: 3px; }\n.page .tools button { font: 11px var(--ui); padding: 1px 6px; background: #fff; color: #555; border-color: #ccc; }\n.pdf-mode .tools { display: none; }\n.page-empty { color: #777; font: 14px var(--ui); text-align: center; padding-top: 60px; }\n.chip .chip-text { padding: 4px 10px 4px 6px; cursor: pointer; }\n.coverage { display: grid; gap: 2px; font-size: 13px; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }\n.coverage p { margin: 0; }\n.coverage .cov-title { font-weight: 600; margin-bottom: 4px; }\n.coverage .cov-row.done b { color: var(--ok); }\n.coverage .cov-row.miss b { color: var(--warn); }\n.coverage .cov-row span { color: var(--muted); }\n.inline-select { width: auto; padding: 2px 6px; font-size: 13px; }\n<\/style>\n<style>\n/* 워크북 메이커에만 쓰는 모양. 기본 화면·쪽 모양은 variant-maker/src/style.css를 함께 쓴다. */\n.wb-types .type { grid-template-columns: auto minmax(0, 1fr); }\n.wb-types .type .desc { grid-column: 2; font-size: 12px; color: var(--muted); line-height: 1.4; }\n\n/* 워크북 쪽 */\n.page .k-answerLine { white-space: nowrap; overflow: hidden; }\n.page .k-answerLine .r-explain { white-space: normal; }\n.page .k-answerLine:has(.r-explain) { white-space: normal; margin-top: 1px; margin-bottom: 5px; }\n.page .k-choice + .k-answerLine { margin-top: 2px; }\n.page .answer-table.wb-table td { height: 26px; padding: 3px 4px; font: 12.67px/1.4 var(--en), var(--kr-serif); }\n.page .answer-table.wb-table th { width: auto; }\n.page .answer-table.wb-table th:first-child { width: auto; }\n.page .k-gridCaption + .k-ans { margin-top: 2px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>영어 워크북 메이커<\/h1>\n    <p>지문을 골라 어휘·해석·어법·빈칸·배열·영작 활동이 담긴 워크북을 만들어 한글·PDF 파일로 저장합니다.<\/p>\n  <\/header>\n\n  <div class=\"layout\">\n    <div class=\"stack\">\n      <section class=\"panel\" aria-labelledby=\"h-lib\">\n        <h2 id=\"h-lib\"><span class=\"step\">1<\/span>지문 보관함<\/h2>\n        <p class=\"hint\">교재별로 지문을 등록해 두는 곳이에요. 변형문제 메이커와 같은 보관함을 함께 써요(영어 메이커의 두 탭, 또는 같은 브라우저에서 파일로 연 두 메이커).<\/p>\n\n        <div class=\"row\">\n          <label class=\"field grow\" for=\"exam\">교재\n            <select id=\"exam\"><\/select>\n          <\/label>\n          <button type=\"button\" id=\"exam-new\">새 교재<\/button>\n          <button type=\"button\" id=\"exam-rename\">이름 바꾸기<\/button>\n          <button type=\"button\" id=\"exam-delete\">삭제<\/button>\n        <\/div>\n        <div class=\"row\" id=\"exam-form\" hidden>\n          <label class=\"field grow\" for=\"exam-name\"><span id=\"exam-form-label\">새 교재 이름<\/span>\n            <input type=\"text\" id=\"exam-name\" placeholder=\"예: 26년 9월 고2 모의고사, 수능특강 영어\">\n          <\/label>\n          <button type=\"button\" class=\"primary\" id=\"exam-save\">확인<\/button>\n          <button type=\"button\" id=\"exam-cancel\">취소<\/button>\n        <\/div>\n        <div class=\"msg warn\" id=\"exam-confirm\" hidden>\n          <span id=\"exam-confirm-text\"><\/span>\n          <button type=\"button\" id=\"exam-confirm-yes\">삭제<\/button>\n          <button type=\"button\" id=\"exam-confirm-no\">취소<\/button>\n        <\/div>\n\n        <div class=\"chips\" id=\"chips\"><\/div>\n        <p class=\"hint\" id=\"chips-count\"><\/p>\n\n        <div class=\"editor\">\n          <div class=\"row\">\n            <label class=\"field\" for=\"p-no\" style=\"width:120px\">지문 번호\n              <input type=\"text\" id=\"p-no\" placeholder=\"29, 3강 1번\">\n            <\/label>\n            <div class=\"row end\">\n              <button type=\"button\" class=\"primary\" id=\"p-save\">지문 저장<\/button>\n              <button type=\"button\" id=\"p-new\">새 지문<\/button>\n              <button type=\"button\" id=\"p-delete\">지문 삭제<\/button>\n            <\/div>\n          <\/div>\n          <label class=\"field\" for=\"passage\">영어 지문\n            <textarea id=\"passage\" rows=\"7\" spellcheck=\"false\"><\/textarea>\n          <\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"by-line\"> 한 줄에 한 문장씩 나눠 넣었어요<\/label>\n          <details>\n            <summary id=\"sent-summary\">문장 나누기 확인<\/summary>\n            <ol class=\"sentences\" id=\"sentences\"><\/ol>\n            <p class=\"hint\">문장이 잘못 나뉘었으면 지문을 한 줄에 한 문장씩 적고 위 칸을 체크하세요.<\/p>\n          <\/details>\n        <\/div>\n        <div id=\"lib-status\" class=\"msg\" hidden><\/div>\n\n        <details>\n          <summary>여러 지문 한꺼번에 등록<\/summary>\n          <div class=\"sub\">\n            <p class=\"hint\">지문마다 번호 줄을 먼저 쓰고 그 아래에 지문을 붙여 넣으세요. 번호 줄은 <code>[18]<\/code>, <code>18번<\/code>, <code>[3강 1번]<\/code>처럼 씁니다. 같은 번호가 이미 있으면 새 지문으로 바꿔요.<\/p>\n            <textarea id=\"bulk\" rows=\"6\" spellcheck=\"false\" placeholder=\"[18]&#10;Dear Ms. Carter, ...&#10;&#10;[19]&#10;The morning sun ...\"><\/textarea>\n            <div class=\"row\"><button type=\"button\" id=\"bulk-add\">지금 교재에 등록<\/button><\/div>\n          <\/div>\n        <\/details>\n        <details>\n          <summary>보관함 백업<\/summary>\n          <div class=\"sub\">\n            <p class=\"hint\">보관함은 이 브라우저에만 저장돼요. 변형문제 메이커에서 저장한 보관함 파일도 그대로 불러올 수 있어요.<\/p>\n            <div class=\"row\">\n              <button type=\"button\" id=\"lib-export\">보관함 파일로 저장<\/button>\n              <label class=\"button\" for=\"lib-import\">보관함 파일 불러오기<\/label>\n              <input type=\"file\" id=\"lib-import\" accept=\".json,application/json\" hidden>\n            <\/div>\n          <\/div>\n        <\/details>\n      <\/section>\n\n      <section class=\"panel\" aria-labelledby=\"h-pick\">\n        <h2 id=\"h-pick\"><span class=\"step\">2<\/span>워크북에 넣을 지문 고르기<\/h2>\n        <p class=\"hint\">보관함의 모든 교재에서 원하는 지문을 골라요. 여러 교재의 지문을 섞어도 돼요.<\/p>\n        <div class=\"picker\" id=\"picker\"><\/div>\n        <div class=\"row between\">\n          <span class=\"hint\" id=\"pick-count\"><\/span>\n          <button type=\"button\" class=\"link\" id=\"pick-none\">모두 해제<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel\" aria-labelledby=\"h-types\">\n        <h2 id=\"h-types\"><span class=\"step\">3<\/span>활동 고르기<\/h2>\n        <p class=\"hint\"><span class=\"tag auto\">자동<\/span> 무료로 바로 만들어요. <span class=\"tag ai\">AI<\/span> Claude가 지문마다 해석·어휘·어법 자료를 한 번 만들어 두고, 다시 만들 때는 그대로 써요.<\/p>\n        <p class=\"hint\">워크북은 변형문제처럼 활동(유형)별로 나뉘고, 각 활동에 고른 지문이 모두 출처와 함께 실려요. 순서: 본문 정리 → 해석 쓰기 → 어휘 양자택일 → 빈칸 채우기 → 어법 선택 → 단어 배열 → 정답.<\/p>\n        <div class=\"types wb-types\" id=\"types\"><\/div>\n        <div class=\"row\">\n          <button type=\"button\" class=\"link\" id=\"select-default\">기본 6가지<\/button>\n          <button type=\"button\" class=\"link\" id=\"select-auto\">자동 활동만<\/button>\n          <button type=\"button\" class=\"link\" id=\"select-all\">모두 고르기<\/button>\n          <button type=\"button\" class=\"link\" id=\"select-none\">모두 해제<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel\" aria-labelledby=\"h-make\">\n        <h2 id=\"h-make\"><span class=\"step\">4<\/span>만들기<\/h2>\n        <div class=\"row\">\n          <button type=\"button\" class=\"primary\" id=\"make\">워크북 만들기<\/button>\n          <button type=\"button\" id=\"stop\" hidden>멈추기<\/button>\n        <\/div>\n        <p class=\"hint\">다시 누르면 빈칸 위치, 섞는 순서가 새로 바뀐 워크북을 만들어요. AI 자료는 이미 만든 것을 그대로 써요.<\/p>\n        <p class=\"hint\" id=\"make-target\"><\/p>\n        <div id=\"status\" class=\"msg\" hidden><\/div>\n\n        <div id=\"manual\" class=\"ai-out\" hidden>\n          <p class=\"hint\" id=\"manual-intro\">AI 활동에 필요한 자료는 Claude 채팅에서 만들어요. ① 요청문을 복사해 <a href=\"https://claude.ai/new\" target=\"_blank\" rel=\"noopener\">claude.ai<\/a>에 붙여 넣고 ② Claude의 답변 전체를 복사해 아래 칸에 붙여 넣은 뒤 ③ 불러오기를 누르세요. 요청문이 여러 개면 답변을 이어 붙여도 돼요.<\/p>\n          <div id=\"prompts\" class=\"prompts\"><\/div>\n          <label class=\"field\" for=\"ai-in\">② Claude의 답변 붙여넣기\n            <textarea id=\"ai-in\" class=\"mono\" rows=\"6\" placeholder='{\"passages\":[ ... ]}'><\/textarea>\n          <\/label>\n          <div class=\"row\"><button type=\"button\" class=\"primary\" id=\"load-ai\">③ 불러오기<\/button><\/div>\n        <\/div>\n      <\/section>\n    <\/div>\n\n    <section class=\"stack\" aria-labelledby=\"h-sheet\">\n      <div class=\"panel\">\n        <div class=\"sheet-bar\">\n          <h2 id=\"h-sheet\">워크북 <span class=\"hint\" id=\"count\">0개 활동<\/span><\/h2>\n          <div class=\"row\">\n            <button type=\"button\" id=\"save-hwpx\" class=\"primary\">한글 파일 저장<\/button>\n            <button type=\"button\" id=\"save-pdf\">PDF 저장<\/button>\n            <button type=\"button\" id=\"clear\">모두 지우기<\/button>\n          <\/div>\n        <\/div>\n        <p class=\"hint\" id=\"save-hint\"><\/p>\n        <div id=\"save-status\" class=\"msg\" hidden><\/div>\n        <div id=\"confirm-clear\" class=\"msg warn\" hidden>\n          워크북을 모두 지울까요? 지문 보관함과 AI 자료는 그대로 남아요.\n          <button type=\"button\" id=\"clear-yes\">지우기<\/button>\n          <button type=\"button\" id=\"clear-no\">취소<\/button>\n        <\/div>\n\n        <details id=\"layout-box\" open>\n          <summary>워크북 꾸미기 (제목·머리말·꼬리말)<\/summary>\n          <div class=\"sub grid2\">\n            <label class=\"field\" for=\"title\">제목\n              <input type=\"text\" id=\"title\" value=\"영어 워크북\">\n            <\/label>\n            <label class=\"field\" for=\"eyebrow\">제목 위 작은 글\n              <input type=\"text\" id=\"eyebrow\" placeholder=\"예: ENGLISH · WORKBOOK\">\n            <\/label>\n            <label class=\"field\" for=\"header-left\">머리말 왼쪽\n              <input type=\"text\" id=\"header-left\" placeholder=\"예: 행복영어학원\">\n            <\/label>\n            <label class=\"field\" for=\"header-right\">머리말 오른쪽\n              <input type=\"text\" id=\"header-right\" placeholder=\"예: 고2 영어\">\n            <\/label>\n            <label class=\"field\" for=\"footer-left\">꼬리말 왼쪽\n              <input type=\"text\" id=\"footer-left\" placeholder=\"예: 김OO 선생님\">\n            <\/label>\n            <label class=\"field\" for=\"footer-right\">꼬리말 오른쪽\n              <input type=\"text\" id=\"footer-right\" placeholder=\"예: cafe.naver.com/…\">\n            <\/label>\n          <\/div>\n          <p class=\"hint\">쪽 번호는 꼬리말 가운데에 자동으로 들어가요.<\/p>\n        <\/details>\n        <div class=\"row\">\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-name\" checked> 반·번호·이름 칸<\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-cols\"> 2단 편집<\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-answers\" checked> 정답지 붙이기<\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-newpage\" checked> 유형마다 새 쪽<\/label>\n        <\/div>\n      <\/div>\n      <div class=\"pages-scroll\" id=\"pages-scroll\"><div class=\"pages\" id=\"pages\"><\/div><\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\n// 한글(HWPX) 빈 문서 틀. tools/make_hwpx_template.py로 만든다.\n// : 32, \"gridCaption\": 33, \"typeHead\": 34, \"ans\": 35, \"answerLine\": 36}, \"borderFill\": {\"box\": 3, \"headRule\": 4, \"footRule\": 5, \"headerRule\": 6, \"typeRule\": 7, \"gridNum\": 8, \"gridAns\": 9}}};\nif (typeof module !== \"undefined\") module.exports = HWPX_TEMPLATE;\n<\/script>\n<script>\n// 변형문제 메이커 핵심 로직 (화면과 무관한 부분).\n// 브라우저에서는 전역 VM으로, Node 테스트에서는 require로 쓴다.\n(function (root) {\n  \"use strict\";\n\n  var CIRCLED = [\"①\", \"②\", \"③\", \"④\", \"⑤\"];\n\n  // 문제지에 실리는 유형 순서\n  var TYPES = [\n    { key: \"claim\", name: \"주장\", mode: \"ai\", instruction: \"다음 글에서 필자가 주장하는 바로 가장 적절한 것은?\" },\n    { key: \"gist\", name: \"요지\", mode: \"ai\", instruction: \"다음 글의 요지로 가장 적절한 것은?\" },\n    { key: \"topic\", name: \"주제\", mode: \"ai\", instruction: \"다음 글의 주제로 가장 적절한 것은?\" },\n    { key: \"title\", name: \"제목\", mode: \"ai\", instruction: \"다음 글의 제목으로 가장 적절한 것은?\" },\n    { key: \"implied\", name: \"함축적 의미\", mode: \"ai\", instruction: \"밑줄 친 부분이 다음 글에서 의미하는 바로 가장 적절한 것은?\" },\n    { key: \"grammar\", name: \"어법\", mode: \"ai\", instruction: \"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\" },\n    { key: \"vocab\", name: \"어휘\", mode: \"ai\", instruction: \"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?\" },\n    { key: \"blank\", name: \"빈칸\", mode: \"ai\", instruction: \"다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.\" },\n    { key: \"order\", name: \"순서\", mode: \"auto\", instruction: \"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.\" },\n    { key: \"insert\", name: \"문장삽입\", mode: \"auto\", instruction: \"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.\" },\n    { key: \"summary\", name: \"요약\", mode: \"ai\", instruction: \"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?\" },\n    { key: \"summaryWrite\", name: \"요약 서술형\", mode: \"ai\", instruction: \"다음 글의 내용을 요약했을 때, 빈칸 (A)~(C)에 들어갈 가장 적절한 단어를 본문에서 각각 한 단어씩 찾아 그대로 쓰시오.\" },\n    { key: \"fix\", name: \"어법 오류 고치기\", mode: \"ai\", instruction: \"위 글의 밑줄 친 (A)~(E) 중 어법상 틀린 부분이 있는 것을 2개 골라 <조건>에 맞게 쓰시오.\" },\n    { key: \"arrange\", name: \"서술형 문장배열\", mode: \"auto\", instruction: \"다음 글의 빈칸 (A)에 들어갈 말을 <보기>의 단어를 모두 한 번씩 사용하여 바르게 배열하시오.\" },\n    { key: \"compose\", name: \"한글 문장 영작\", mode: \"ai\", instruction: \"다음 글의 밑줄 친 우리말 (A)를 <조건>에 맞게 영작하시오.\" }\n  ];\n\n  // 유형 묶음 아이콘: ◆ 대의 파악, ■ 어법·어휘, ● 빈칸·요약, ▲ 글의 흐름, ★ 서술형 (한글 기본 글꼴에 있는 기호)\n  var TYPE_ICON = {\n    claim: \"◆\", gist: \"◆\", topic: \"◆\", title: \"◆\", implied: \"◆\",\n    grammar: \"■\", vocab: \"■\", blank: \"●\", summary: \"●\", order: \"▲\", insert: \"▲\",\n    summaryWrite: \"★\", fix: \"★\", arrange: \"★\", compose: \"★\"\n  };\n\n  var TYPE_BY_KEY = {};\n  TYPES.forEach(function (t, i) { t.order = i; TYPE_BY_KEY[t.key] = t; });\n\n  // ---------- 난수 ----------\n\n  function makeRng(seed) {\n    var a = (seed === undefined || seed === null) ? Math.floor(Math.random() * 4294967296) : seed >>> 0;\n    function next() {\n      a = (a + 0x6D2B79F5) >>> 0;\n      var t = a;\n      t = Math.imul(t ^ (t >>> 15), t | 1);\n      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    }\n    return {\n      next: next,\n      int: function (lo, hi) { return lo + Math.floor(next() * (hi - lo + 1)); },\n      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },\n      shuffle: function (arr) {\n        var a2 = arr.slice();\n        for (var i = a2.length - 1; i > 0; i--) {\n          var j = Math.floor(next() * (i + 1));\n          var tmp = a2[i]; a2[i] = a2[j]; a2[j] = tmp;\n        }\n        return a2;\n      }\n    };\n  }\n\n  // 정답 번호가 한쪽으로 몰리지 않도록 0~(n-1)을 골고루 섞어 돌려준다.\n  function spreadAnswers(count, n, rng) {\n    var out = [];\n    while (out.length < count) out = out.concat(rng.shuffle(range(n)));\n    return out.slice(0, count);\n  }\n\n  function range(n) {\n    var r = [];\n    for (var i = 0; i < n; i++) r.push(i);\n    return r;\n  }\n\n  // ---------- 문장 나누기 ----------\n\n  var ABBREVIATIONS = [\n    \"mr\", \"mrs\", \"ms\", \"dr\", \"prof\", \"sr\", \"jr\", \"st\ }\n    }\n    return configs;\n  }\n\n  // 정답 번호 뽑개: ①~⑤를 섞어 한 바퀴씩 돌려준다. 여러 지문에 같은 뽑개를 쓰면 전체에서 정답이 골고루 나온다.\n  function answerDeck(rng) {\n    var bag = [];\n    return function () {\n      if (!bag.length) bag = rng.shuffle(range(5));\n      return bag.pop();\n    };\n  }\n\n  // ---------- 회차끼리 겹치지 않게 ----------\n\n  function norm(s) { return String(s || \"\").replace(/<\\/?[ub]>/gi, \"\").replace(/\\s+/g, \" \").trim().toLowerCase(); }\n\n  function orderSignature(given, chunks) {\n    return \"o:\" + norm(given) + \"|\" + chunks.map(norm).sort().join(\"|\");\n  }\n\n  // 문제의 '알맹이'를 나타내는 문자열. 같으면 같은 문제로 본다.\n  function problemSignature(p) {\n    var correct = p.choices && CIRCLED.indexOf(p.answer) >= 0 ? p.choices[CIRCLED.indexOf(p.answer)] : p.answer;\n    var underlines = (String(p.passage || \"\").match(/<u>([^]*?)<\\/u>/gi) || [])\n      .map(function (u) { return norm(u.replace(/<\\/?u>/gi, \"\").replace(/^\\s*(?:[①-⑤]|\\([a-hA-H]\\))\\s*/, \"\")); }).sort().join(\"|\");\n    switch (p.type) {\n      case \"order\": return orderSignature(p.box, String(p.passage || \"\").split(\"\\n\").map(function (l) { return l.replace(/^\\([ABC]\\)\\s*/, \"\"); }));\n      case \"insert\": return \"i:\" + norm(p.box);\n      case \"arrange\": return \"a:\" + norm(p.answer);\n      case \"grammar\": case \"vocab\": case \"fix\": return p.type + \":\" + underlines;\n      case \"implied\": return \"m:\" + underlines;\n      case \"compose\": return \"c:\" + norm(p.answer);\n      case \"summaryWrite\": return \"w:\" + norm(p.answer);\n      default: return p.type + \":\" + norm(correct);\n    }\n  }\n\n  function signatureSet(list) {\n    var set = {};\n    (list || []).forEach(function (p) { set[problemSignature(p)] = true; });\n    return set;\n  }\n\n  // 겹치지 않는 후보를 앞에, 겹치는 후보를 뒤에 둔다(모자라면 뒤의 것도 쓴다).\n  function preferFresh(items, sig, taken) {\n    return items.filter(function (x) { return !taken[sig(x)]; }).concat(items.filter(function (x) { return taken[sig(x)]; }));\n  }\n\n  // 같은 지문·같은 유형에서 알맹이가 같은 문제 쌍을 찾는다. 돌려주는 값: [[i, j], ...] (문제지 순서 번호)\n  function findDuplicates(problems) {\n    var seen = {}, pairs = [];\n    problems.forEach(function (p, i) {\n      if (!p.source) return;\n      var k = p.type + \"\\u0001\" + (p.source.exam || \"\") + \"\\u0001\" + p.source.no + \"\\u0001\" + problemSignature(p);\n      if (seen[k] !== undefined) pairs.push([seen[k], i]);\n      else seen[k] = i;\n    });\n    return pairs;\n  }\n\n  // AI에게 \"이미 만든 문제와 겹치지 않게\" 알려 줄 한 줄 요약\n  function avoidNote(p) {\n    var correct = p.choices && CIRCLED.indexOf(p.answer) >= 0 ? norm(p.choices[CIRCLED.indexOf(p.answer)]) : \"\";\n    var underlines = (String(p.passage || \"\").match(/<u>([^]*?)<\\/u>/gi) || []).map(function (u) { return u.replace(/<\\/?u>/gi, \"\").replace(/^\\s*(?:[①-⑤]|\\([a-hA-H]\\))\\s*/, \"\").trim(); });\n    if (p.type === \"grammar\" || p.type === \"vocab\" || p.type === \"fix\") return \"밑줄 친 곳: \" + underlines.join(\", \");\n    if (p.type === \"implied\") return \"밑줄 친 표현: \" + underlines.join(\", \") + (correct ? \" / 정답 선지: \" + correct : \"\");\n    if (p.type === \"compose\") return \"영작한 문장: \" + plainText(p.answer);\n    if (p.type === \"summaryWrite\") return \"빈칸 정답: \" + plainText(p.answer);\n    if (p.type === \"blank\") return \"빈칸 정답: \" + correct;\n    return \"정답 선지: \" + correct;\n  }\n\n  // avoid: 같은 지문·같은 유형으로 이미 만든 문제들. 겹치지 않는 것을 먼저 쓴다.\n  function makeOrder(sentences, count, rng, deck, avoid) {\n    var n = sentences.length;\n    if (n < 4) throw new Error(\"순서 문제는 문장이 4개 이상 필요합니다. (지금 \" + n + \"개)\");\n    var taken = signatureSet(avoid);\n    var configs = preferFresh(rng.shuffle(orderConfigs(n)), function (c) {\n      var rest = sentences.slice(c.given);\n      return orderSignature(sentences.slice(0, c.given).join(\" \"), [rest.slice(0, c.cuts[0]), rest.slice(c.cuts[0], c.cuts[1]), rest.slice(c.cuts[1])].map(function (ch) { return ch.join(\" \"); }));\n    }, taken);\n    var answers = deck ? range(count).map(function () { return deck(); }) : spreadAnswers(count, 5, rng);\n    var problems = [];\n    for (var k = 0; k < count; k++) {\n      var c = configs[k % configs.length];\n      var given = sentences.slice(0, c.given);\n      var rest = sentences.slice(c.given);\n      var chunks = [rest.slice(0, c.cuts[0]), rest.slice(c.cuts[0], c.cuts[1]), rest.slice(c.cuts[1])];\n      var perm = ORDER_PERMS[answers[k]]; // perm[위치] = 그 위치에 오는 덩어리의 라벨 번호\n      var byLabel = [];\n      for (var pos = 0; pos < 3; pos++) byLabel[perm[pos]] = chunks[pos];\n      problems.push({\n        type: \"order\",\n        instruction: TYPE_BY_KEY.order.instruction,\n        box: given.join(\" \"),\n        boxFirst: true,\n        passage: byLabel.map(function (ch, li) { return LABELS[li] + \" \" + ch.join(\" \"); }).join(\"\\n\"),\n        choices: ORDER_PERMS.map(function (p) { return p.map(function (x) { return LABELS[x]; }).join(\" - \"); }),\n        answer: CIRCLED[answers[k]],\n        explanation: \"주어진 글 → \" + perm.map(function (x) { return LABELS[x]; }).join(\" → \")\n      });\n    }\n    return problems;\n  }\n\n  // ---------- 자동 생성: 문장삽입 ----------\n\n  var LINKERS = /^(however|but|yet|still|thus|therefore|hence|consequently|as a result|for example|for instance|in addition|moreover|furthermore|besides|also|similarly|likewise|in contrast|on the other hand|instead|otherwise|nevertheless|nonetheless|meanwhile|then|this|these|that|those|such|it|they|he|she|its|their|his|her|in other words|in fact|indeed|after all|unfortunately|fortunately)\\b/i;\n\n  function makeInsert(sentences, count, rng, deck, avoid) {\n    var n = sentences.length;\n    if (n < 4) throw new Error(\"문장삽입 문제는 문장이 4개 이상 필요합니다. (지금 \" + n + \"개)\");\n    // 빼낼 문장 후보: 첫 문장 제외. 연결어·지시어로 시작하는 문장을 먼저 쓴다.\n    var cands = range(n).slice(1);\n    var strong = rng.shuffle(cands.filter(function (i) { return LINKERS.test(sentences[i]); }));\n    var weak = rng.shuffle(cands.filter(function (i) { return !LINKER  글에 없는 내용으로 만든다. passage는 원문 그대로.\",\n    topic: \"글의 주제를 묻는 문제. choices는 영어 명사구 5개(소문자로 시작, 마침표 없음, 예: 'effects of social media on self-esteem'). 오답은 너무 넓거나 좁거나, 글의 세부 사항이거나, 반대 방향인 것. passage는 원문 그대로.\",\n    title: \"글의 제목을 묻는 문제. choices는 영어 제목 5개(주요 단어 첫 글자 대문자, 의문문·감탄문·콜론 형식도 가능). 정답은 요지를 비유적으로 표현해도 좋다. passage는 원문 그대로.\",\n    grammar: \"어법상 틀린 것을 고르는 문제. passage에서 서로 다른 고난도 어법 포인트 5곳에 <u>①단어 또는 짧은 구<\/u>, <u>②…<\/u> … <u>⑤…<\/u> 형식으로 번호와 밑줄을 넣는다(아래 '어법 출제 수준'을 따른다). 그중 정확히 1곳만 어법상 틀리게 바꾸고, 나머지 4곳과 나머지 지문은 원문 그대로 둔다. choices는 null. explanation에 다섯 밑줄 각각의 출제 포인트를 짧게 쓰고, 틀린 곳은 올바른 형태와 그 이유를 문장 구조로 설명한다.\",    vocab: \"문맥상 낱말 쓰임이 적절하지 않은 것을 고르는 문제. passage에서 내용어 5곳에 <u>①단어<\/u> … <u>⑤단어<\/u> 형식으로 번호와 밑줄을 넣는다. 그중 정확히 1곳만 문맥과 반대되거나 어울리지 않는 낱말(주로 반의어)로 바꾸고 나머지는 원문 그대로 둔다. choices는 null. explanation에 원래 낱말을 쓴다.\",\n    implied: \"밑줄 친 함축적 의미를 묻는 문제. passage에서 비유적이거나 함축적인 표현 하나에 <u>…<\/u> 밑줄을 넣는다(나머지는 원문 그대로). instruction은 '밑줄 친 <표현>이 다음 글에서 의미하는 바로 가장 적절한 것은?'처럼 그 표현을 넣어 쓴다. choices는 영어 5개(문장 또는 구).\",\n    blank: \"빈칸 추론 문제. passage에서 글의 핵심을 담은 단어·구·절 하나를 ________________ 로 바꾼다(나머지는 원문 그대로). choices는 영어 5개이며 정답은 원문 표현이나 같은 뜻의 바꿔 쓴 표현. 오답은 그럴듯하지만 글의 논리와 맞지 않게 만든다.\",\n    summary: \"요약문 완성 문제. passage는 원문 그대로. box에 글 전체를 요약한 영어 한 문장을 쓰고, 핵심어 두 곳을 (A) ________ 와 (B) ________ 로 비운다. boxFirst는 false. choices는 5개이며 각 항목은 '(A)에 들어갈 말 …… (B)에 들어갈 말' 형식(예: 'flexible …… reduced'). 정답 단어는 본문에 그대로 나오지 않는 바꿔 쓴 말이 좋다.\",\n    compose: \"우리말 영작 문제. passage에서 한 문장(또는 절)을 골라 그 자리를 '(A) <u>그 문장의 자연스러운 한국어 번역<\/u>'으로 바꾼다. box에는 '<조건>'으로 시작하는 조건 2~3줄(예: 주어진 단어 사용, 단어 수, 필수 어법)을 줄바꿈(\\\\n)으로 나눠 쓴다. boxFirst는 false. choices는 null. answer는 원문 영어 문장.\",\n    summaryWrite: \"요약문 빈칸 서술형 문제. passage는 원문 그대로. box에 글 전체 내용을 요약한 영어 한 문장(또는 두 문장)을 쓰고, 핵심 단어 세 곳을 (A) ________, (B) ________, (C) ________ 로 비운다. 세 빈칸의 정답은 모두 본문(passage)에 그대로 나오는 한 단어여야 하며(형태를 바꾸지 않음), 각 빈칸에 들어갈 수 있는 본문 단어는 하나뿐이어야 한다. boxFirst는 false. choices는 null. answer는 '(A) practice (B) quality (C) effort' 형식.\",\n    fix: \"어법 오류를 찾아 고치는 서술형 문제. passage에는 지문 전체를 빠짐없이 원문 순서대로 싣는다(문장을 빼거나 줄이지 않음). 그중 서로 다른 다섯 문장을 골라 각 문장 전체에 <u>(A) 문장 전체<\/u>, <u>(B) 문장 전체<\/u> … <u>(E) 문장 전체<\/u> 형식으로 기호와 밑줄을 넣는다(한 기호 = 한 문장, 문장 일부만 밑줄 긋지 않음). 다섯 문장 중 정확히 2문장에만 어법상 틀린 단어를 한 개씩 넣고, 나머지 3문장과 밑줄 없는 문장은 원문 그대로 둔다. 틀린 곳과 옳은 문장 모두 아래 '어법 출제 수준'의 고난도 포인트를 담은 문장으로 고른다. explanation에는 틀린 두 곳의 출제 포인트와 이유를 문장 구조로 설명한다. 틀린 부분과 고친 형태는 각각 한 단어여야 한다. box는 null(조건은 프로그램이 넣음). choices는 null. answer는 '(B) is → are, (D) using → used' 형식(알파벳 순서대로).\",\n  };\n\n  // 어법·어휘처럼 번호가 지문 속에 박히는 유형은 나중에 정답을 옮길 수 없어, 만들 때 정답 번호를 정해 준다.\n  var FIXED_ANSWER_TYPES = { grammar: true, vocab: true };\n\n  // targets: 문제마다 원하는 정답 번호(0~4) 목록. 어법·어휘에만 쓴다.\n  // 어법(객관식)·어법 오류 고치기에 붙이는 출제 수준 지침. 뻔한 포인트를 막고 구조 분석이 필요한 문제를 내게 한다.\n  var GRAMMAR_TYPES = { grammar: true, fix: true };\n  var GRAMMAR_GUIDE = [\n    \"## 어법 출제 수준 (고2~고3 내신 상위권)\",\n    \"- 밑줄마다 출제 의도가 분명한 어법 포인트 하나를 묻는다. 학생이 문장 구조를 분석해야 판단할 수 있는 것을 고른다.\",\n    \"- 아래 포인트를 지문에 맞게 골고루 섞어 쓴다(한 문제 안의 밑줄은 서로 다른 포인트).\",\n    \"  1. 수일치: 주어와 동사 사이에 전치사구·관계절·분사구·삽입절이 길게 끼어 있는 경우, 주어 찾기가 어려운 경우(동명사구·명사절 주어, the number of / a number of, 부분 표현 + of + 명사, 상관접속사, 선행사와 관계절 동사)\",\n    \"  2. 주어에서 멀리 떨어진 본동사 찾기: 동사 자리인가 준동사 자리인가, 본동사가 없거나 겹치는 문장\",\n    \"  3. 문장 형식: 4형식 직접목적어 자리의 that절·what절·의문사절, 5형식 목적격보어 형태(to부정사/원형부정사/현재분사/과거분사) — 사역동사 have·make·let, 지각동사, help, get, keep, find. 특히 have/get + 목적어 + 과거분사\",\n    \"  4. 가목적어 it + 진목적어(to부정사구·that절), 가주어 it + 진주어\",\n    \"  5. 동명사만 목적어로 취하는 동사(avoid, deny, mind, finish, consider, postpone, admit, quit, suggest 등), to부정사·동명사에 따라 뜻이 달라지는 동사(remember, forget, stop, regret, try)\",\n    \"  6. 관계대명사 that vs what: 선행사가 있는가, 뒤 절이 불완전한가\",\n    \"  7. 관계대명사 vs 관계부사 vs 전치사 + 관계대명사: 뒤 절이 완전한가 불완전한가(which / where / in which / whom / whose)\",\n    \"  8. 분사구문: 의미상 주어와의 능동·수동(현재분사/과거분사), 완료 분사구문, 접속사 + 분사, 독립 분사구문\",\n    \"  9. 도치: 부정어(never, rarely, little, hardly, not only, no sooner, only + 부사구) 문두 도치의 어순, 장소·방향 부사구 도치, so/neither 도치, 도치 구문 안의 주어-동사 수일치\",\n    \"  10. 그 밖의 고난도: 멀리 떨어진 병렬 구조, 대명사 수일치(it/they, that/those), 재귀대명사, 2형식 보어 자리의 형용사 vs 부사, 접속사 vs 전치사(although/despite, because/because of), 자동사의 수동태 불가, 수동태 뒤 목적어\",\n    \"- 쓰지 말 것(너무 쉬운 포인트): 조동사 뒤 동사원형(will being, can goes 같은 것), 명백한 철자 오류, 주어 바로 뒤 동사의 단순 수일치, 누구나 아는 불규칙 동사 형태, 관사 하나 바꾸기, 뜻이 통하지 않을 만큼 엉뚱한 단어.\",\n    \"- 틀린 곳은 그럴듯한 함정이어야 한다: 바로 앞 단어만 보면 맞아 보이지만 문장 구조를 분석해야 틀렸음을 알 수 있게 만든다.\",\n    \"- 옳은 밑줄도 학생이 헷갈릴 만한 고난도 포인트로 고른다(뻔히 옳아 보이는 곳 X).\",\n    \"- 지문에 해당 구조가 없으면 의미를 바꾸지 않는 범위에서 그 구조가 드러나도록 표현을 조금 바꿔도 된다(어법 오류 고치기에서는 밑줄 문장 안에서만).\",\n    \"- 목표 수준 예시(이 정도의 난이도와 해설을 기준으로 삼는다):\",\n    \"  · research on how artists develop their skills ①suggests that … → 옳음. 주어 research와 동사 사이 전치사구 때문에 복수 skills에 속기 쉬운 멀리 떨어진 수일치\",\n    \"  · our brains form connections ③where did not exist before → 틀림(that/which). 뒤 절에 주어가 없는 불완전한 절이므로 관계부사가 아니라 주격 관계대명사\",\n    \"  · the habit makes it ④easier to let quantity lead to quality → 옳음. 가목적어 it + 형용사 목적격보어 + 진목적어\",\n    \"  · Rarely ⑤do such surprises appear … → 옳음. 부정어 문두 도치와 복수 주어 수일치\",\n    \"  · a designer … soon finds what unusual solutions come more easily → 틀림(that). 뒤 절이 완전하므로 명사절 접속사 that\",\n    \"  · Such surprises rarely appear …, emerging instead in the middle of steady effort → 옳음. 자동사 emerge의 능동 분사구문(emerged로 바꾸면 함정)\"\n  ].join(\"\\n\");\n\n  // avoidNotes: 같은 지문·같은 유형으로 이미 만든 문제 요약(avoidNote). 이것들과 겹치지 않게 만들게 한다.\n  function buildPrompt(passage, typeKey, count, targets, avoidNotes) {\n    var t = TYPE_BY_KEY[typeKey];\n    if (!t || t.mode !== \"ai\") throw new Error(\"AI 유형이 아닙니다: \" + typeKey);\n    return [\n      \"당신은 한국 고등학교 영어 교사로, 수능·모의고사 형식의 영어 변형문제를 만듭니다.\",\n      \"아래 지문으로 [\" + t.name + \"] 유형 문제를 \" + count + \"개 만드세요.\",\n      \"\",\n      \"## 유형 설명\",\n      AI_SPECS[typeKey],\n      GRAMMAR_TYPES[typeKey] ? \"\\n\" + GRAMMAR_GUIDE : \"\",\n      \"\",\n      \"## 공통 규칙\",\n      \"- 기본 발문: \" + t.instruction,\n      targets && targets.length ? \"- 정답 번호는 문제 순서대로 \" + targets.map(function (x) { return CIRCLED[x]; }).join(\", \") + \"가 되게 만드세요.\" : \"\",\n      \"- 여러 문제를 만들 때는 문제마다 선지·밑줄 위치·정답 번호가 서로 달라야 합니다.\",\n      \"- 정답은 반드시 하나뿐이어야 합니다. 출력 전에 오답 선지가 지문 내용상 정답이 될 여지가 없는지, 선지끼리 같은 뜻이 아닌지, 표시한 정답과 해설이 맞는지 스스로 다시 확인하세요.\",\n      \"- 객관식 정답은 ①~⑤ 중 하나로 쓰고, 여러 문제의 정답 번호가 한쪽으로 몰리지 않게 합니다.\",\n      \"- 밑줄은 <u>…<\/u>, 굵은 글씨는 <b>…<\/b> 태그만 씁니다. 다른 태그나 마크다운은 쓰지 않습니다.\",\n      \"- 문단을 나눌 때는 \\\\n 을 씁니다.\",\n      GRAMMAR_TYPES[typeKey] ? \"- explanation은 한국어로, 출제 포인트와 이유가 드러나게 3~5문장으로 씁니다.\" : \"- explanation은 한국어 1~2문장으로 씁니다.\",\n      \"\",\n      avoidNotes && avoidNotes.length ? \"\\n## 이미 만든 문제 (이번 문제는 이것들과 밑줄 위치·빈칸·정답 선지·출제 포인트가 겹치지 않게 새로 만드세요)\\n\" + avoidNotes.map(function (a) { return \"- \" + a; }).join(\"\\n\") + \"\\n\" : \"\",\n      \"## 출력 형식\",\n      \"설명 없이 JSON만 출력합니다.\",\n      '{\"problems\":[{\"instruction\":\"발문\",\"box\":\"상자에 넣을 글 또는 null\",\"boxFirst\":true,\"passage\":\"지문\",\"choices\":[\"…\",\"…\",\"…\",\"…\",\"…\"] 또는 null,\"answer\":\"③\",\"explanation\":\"해설\"}]}',\n      \"\",\n      \"## 지문\",\n      normalizeText(passage).trim()\n    ].join(\"\\n\");\n  }\n\n  // 여러 지문과 여러 유형을 한 번에 요청하는 요청문 (Claude 채팅에 붙여 넣는 용도)\n  // plan: {유형: {지문 번호: [정답 번호(0~4)…]}} — 어법·어휘의 정답 번호 지정\n  function buildCombinedPrompt(passages, requests, plan) {\n    var parts = requests.map(function (r) {\n      var t = TYPE_BY_KEY[r.type];\n      return \"### \" + t.name + \" (지문마다 \" + r.count + \"문제, type 값: \\\"\" + r.type + \"\\\")\\n- 기본 발문: \" + t.instruction + \"\\n- \" + AI_SPECS[r.type];\n    });\n    var texts = passages.map(function (p, i) {\n      var id = p.no || String(i + 1);\n      return \"### 지문 [\" + id + \"]\\n\" + normalizeText(p.text).trim();\n    });\n    return [\n      \"당신은 한국 고등학교 영어 교사로, 수능·모의고사 형식의 영어 변형문제를 만듭니다.\",\n      \"아래 \" + passages.length + \"개 지문 각각으로 다음 유형의 문제를 만드세요.\",\n      \"\",\n      parts.join(\"\\n\\n\"),\n      requests.some(function (r) { return GRAMMAR_TYPES[r.type]; }) ? \"\\n\" + GRAMMAR_GUIDE : \"\",\n      \"\",\n      \"## 공통 규칙\",\n      \"- 같은 유형의 문제끼리는 선지·밑줄 위치·정답 번호가 서로 달라야 합니다.\",\n      \"- 정답은 반드시 하나뿐이어야 합니다. 출력 전에 오답 선지가 지문 내용상 정답이 될 여지가 없는지, 선지끼리 같은 뜻이 아닌지, 표시한 정답과 해설이 맞는지 스스로 다시 확인하세요.\",\n      \"- 객관식 정답은 ①~⑤ 중 하나로 쓰고, 정답 번호가 한쪽으로 몰리지 않게 합니다.\",\n      \"- 밑줄은 <u>…<\/u>, 굵은 글씨는 <b>…<\/b> 태그만 씁니다. 다른 태그나 마크다운은 쓰지 않습니다.\",\n      \"- 문단을 나눌 때는 \\\\n 을 씁니다. explanation은 한국어 1~2문장(어법·어법 오류 고치기는 출제 포인트가 드러나게 3~5문장).\",\n      planLines(passages, requests, plan),\n      \"\",\n      \"## 출력 형식\",\n      \"설명 없이 JSON만 출력합니다. 각 문제에 type 값과, 어느 지문으로 만들었는지 src 값(지문 [ ] 안의 번호)을 반드시 넣습니다.\",\n      '{\"problems\":[{\"src\":\"' + (passages[0].no || \"1\") + '\",\"type\":\"topic\",\"instruction\":\"발문\",\"box\":null,\"boxFirst\":true,\"passage\":\"지문\",\"choices\":[\"…\",\"…\",\"…\",\"…\",\"…\"],\"answer\":\"③\",\"explanation\":\"해설\"}]}',\n      \"\",\n      \"## 지문\",\n      texts.join(\"\\n\\n\")\n    ].join(\"\\n\");\n  }\n\n  function planLines(passages, requests, plan) {\n    if (!plan) return \"\";\n    var lines = [];\n    var avoid = plan.__avoid || {};\n    passages.forEach(function (p, i) {\n      var id = p.no || String(i + 1);\n      requests.forEach(function (r) {\n        var notes = avoid[r.type] && avoid[r.type][id];\n        if (notes && notes.length) lines.push(\"- 지문 [\" + id + \"] \" + TYPE_BY_KEY[r.type].name + \"는 이미 만든 문제와 겹치지 않게 (\" + notes.join(\" / \") + \")\");\n      });\n    });\n    requests.forEach(function (r) {\n      if (!plan[r.type]) return;\n      passages.forEach(function (p, i) {\n        var id = p.no || String(i + 1);\n        var want = plan[r.type][id];\n        if (want && want.length) lines.push(\"- 지문 [\" + id + \"] \" + TYPE_BY_KEY[r.type].name + \": 정답 번호를 문제 순서대로 \" + want.map(function (x) { return CIRCLED[x]; }).join(\", \") + \"로 만드세요.\");\n      });\n    });\n    return lines.length ? \"- 아래 내용을 지켜 주세요.\\n\" + lines.join(\"\\n\") : \"\";\n  }\n\n  // ---------- 지문 여러 개 한꺼번에 등록 ----------\n\n  // 번호 줄: \"[18]\", \"[41-42]\", \"[3강 1번]\", \"18번\"\n  var PASSAGE_MARK = /^\\s*(?:\\[\\s*([^\\]\\n]{1,20}?)\\s*\\]|(\\d{1,3}(?:\\s*[-~]\\s*\\d{1,3})?)\\s*번)\\s*[.:)]?\\s*$/;\n  var NUMERIC_NO = /^\\d+(?:-\\d+)?$/;\n\n  // \"41 ~ 42번\" → \"41-42\", \"3강  1번\" → \"3강 1번\"\n  function normalizeNo(no) {\n    var s = String(no == null ? \"\" : no).trim().replace(/\\s+/g, \" \").replace(/\\s*[-~]\\s*/g, \"-\");\n    var m = s.match(/^(\\d+(?:-\\d+)?)\\s*번$/);\n    return m ? m[1] : s;\n  }\n\n  // 화면과 문제지에 쓰는 지문 번호: 숫자면 \"29번\", 아니면 그대로\n  function noLabel(no) {\n    return NUMERIC_NO.test(no) ? no + \"번\" : String(no || \"\");\n  }\n\n  // \"[18]\" 또는 \"18번\" 줄로 시작하는 지문들을 나눈다.\n  function parseBulkPassages(text) {\n    var out = [], current = null;\n    normalizeText(text).split(\"\\n\").forEach(function (line) {\n      var m = line.match(PASSAGE_MARK);\n      if (m) {\n        current = { no: normalizeNo(m[1] || m[2]), lines: [] };\n        out.push(current);\n      } else if (current) {\n        current.lines.push(line);\n      }\n    });\n    return out.map(function (p) { return { no: p.no, text: p.lines.join(\"\\n\").trim() }; })\n      .filter(function (p) { return p.text; });\n  }\n\n  // ---------- AI 답변 읽기 ----------\n\n  // 글 속에 들어 있는 JSON 값들을 모두 꺼낸다. 답변 여러 개를 이어 붙여도 읽을 수 있다.\n  function extractJsonAll(text) {\n    if (text && typeof text === \"object\") return [text];\n    var s = String(text || \"\").replace(/```(?:json)?/g, \"\");\n    var found = [];\n    for (var i = 0; i < s.length; i++) {\n      if (s[i] !== \"{\") continue;\n      var depth = 0, inStr = false, esc = false, j = i;\n      for (; j < s.length; j++) {\n        var c = s[j];\n        if (inStr) {\n          if (esc) esc = false;\n          else if (c === \"\\\\\") esc = true;\n          else if (c === \"\\\"\") inStr = false;\n        } else if (c === \"\\\"\") inStr = true;\n        else if (c === \"{\") depth++;\n        else if (c === \"}\") { depth--; if (depth === 0) break; }\n      }\n      if (depth !== 0) break;\n      try { found.push(JSON.parse(s.slice(i, j + 1))); i = j; } catch (e) { /* 다음 { 부터 다시 */ }\n    }\n    if (!found.length) throw new Error(\"AI 답변에서 JSON을 찾지 못했습니다. 답변 전체를 그대로 붙여 넣었는지 확인하세요.\");\n    return found;\n  }\n\n  function normalizeAnswer(ans) {\n    var s = String(ans == null ? \"\" : ans).trim();\n    if (/^[1-5]$/.test(s)) return CIRCLED[Number(s) - 1];\n    return s;\n  }\n\n  // AI 답변을 문제 목록으로 바꾼다.\n  // ctx: {type: 기본 유형, exam: 시험 이름, no: 기본 지문 번호}\n  function parseAiProblems(text, ctx) {\n    if (typeof ctx === \"string\" || ctx == null) ctx = { type: ctx };\n    var list = [];\n    extractJsonAll(text).forEach(function (data) {\n      var items = Array.isArray(data) ? data : data.problems;\n      if (Array.isArray(items)) list = list.concat(items);\n    });\n    if (!list.length) throw new Error(\"AI 답변에 problems 목록이 없습니다.\");\n    var warnings = [];\n    var problems = list.map(function (p, i) {\n      var type = TYPE_BY_KEY[p.type] ? p.type : ctx.type;\n      if (!TYPE_BY_KEY[type]) throw new Error((i + 1) + \"번째 문제의 유형(type)을 알 수 없습니다.\");\n      var choices = Array.isArray(p.choices) && p.choices.length ? p.choices.map(String) : null;\n      var label = TYPE_BY_KEY[type].name + \" \" + (i + 1) + \"번째 문제\";\n      if (choices && choices.length !== 5) warnings.push(label + \": 선지가 \" + choices.length + \"개입니다.\");\n      if (!p.answer) warnings.push(label + \": 정답이 비어 있습니다.\");\n      if (!p.passage) warnings.push(label + \": 지문이 비어 있습니다.\");\n      var no = normalizeNo(p.src != null ? p.src : ctx.no);\n      return {\n        type: type,\n        instruction: p.instruction ? String(p.instruction) : TYPE_BY_KEY[type].instruction,\n        box: p.box ? String(p.box) : null,\n        boxFirst: p.boxFirst !== false,\n        passage: String(p.passage || \"\"),\n        choices: choices,\n        answer: normalizeAnswer(p.answer),\n        explanation: p.explanation ? String(p.explanation) : \"\",\n        source: no ? { exam: ctx.exam || \"\", no: no } : null\n      };\n    });\n    return { problems: problems, warnings: warnings };\n  }\n\n  // ---------- 검수 ----------\n\n  // AI가 만든 유형(자동 유형은 원문에서 바로 만들어 검수할 필요가 없다)\n  function needsReview(p) {\n    return TYPE_BY_KEY[p.type] && TYPE_BY_KEY[p.type].mode === \"ai\";\n  }\n\n  function plainText(s) { return String(s || \"\").replace(/<\\/?[ub]>/gi, \"\").replace(/\\s+/g, \" \").trim(); }\n\n  // 프로그램이 직접 하는 형식 검사. 문제마다 고칠 점 목록을 돌려준다.\n  // original: 원문(있으면 지문이 빠짐없이 실렸는지도 본다)\n  function checkProblem(p, original) {\n    var issues = [];\n    var mcTypes = { claim: 1, gist: 1, topic: 1, title: 1, implied: 1, blank: 1, summary: 1, order: 1 };\n    var ans = CIRCLED.indexOf(p.answer);\n    if (mcTypes[p.type]) {\n      if (!p.choices || p.choices.length !== 5) issues.push(\"선지가 5개가 아니에요\");\n      else {\n        var seen = {};\n        p.choices.forEach(function (c, i) {\n          var k = plainText(c).toLowerCase().replace(/[.!?]$/, \"\");\n          if (seen[k] !== undefined) issues.push(CIRCLED[seen[k]] + \"와 \" + CIRCLED[i] + \" 선지가 같아요\");\n          seen[k] = i;\n          if (!k) issues.push(CIRCLED[i] + \" 선지가 비어 있어요\");\n        });\n      }\n      if (ans < 0) issues.push(\"정답이 ①~⑤ 중 하나가 아니에요\");\n    }\n    if (p.type === \"grammar\" || p.type === \"vocab\") {\n      var marks = (String(p.passage).match(/<u>\\s*[①-⑤]/g) || []).map(function (m) { return m.replace(/<u>\\s*/, \"\"); });\n      var uniq = marks.filter(function (m, i) { return marks.indexOf(m) === i; });\n      if (uniq.length !== 5) issues.push(\"밑줄 번호(①~⑤)가 \" + uniq.length + \"개예요\");\n      if (ans < 0) issues.push(\"정답이 ①~⑤ 중 하나가 아니에요\");\n      else if (uniq.length && uniq.indexOf(p.answer) < 0) issues.push(\"정답 \" + p.answer + \"가 지문의 밑줄 번호에 없어요\");\n    }\n    if (p.type === \"insert\") {\n      var m2 = (String(p.passage).match(/\\( [①-⑤] \\)/g) || []).length;\n      if (m2 < 3) issues.push(\"자리 표시가 \" + m2 + \"개뿐이에요\");\n    }\n    if (WRITE_TYPES[p.type] && !plainText(p.answer)) issues.push(\"모범 답안이 비어 있어요\");\n    issues = issues.concat(trivialGrammar(p));\n    if (p.type === \"summaryWrite\") {\n      var words = parseLetteredAnswer(p.answer, [\"A\", \"B\", \"C\"]);\n      var body = \" \" + plainText(p.passage).toLowerCase().replace(/[^a-z'\\-]+/g, \" \") + \" \";\n      [\"A\", \"B\", \"C\"].forEach(function (L) {\n        var w = (words[L] || \"\").toLowerCase();\n        if (!w) issues.push(\"(\" + L + \") 정답이 없어요\");\n        else if (/\\s/.test(w)) issues.push(\"(\" + L + \") 정답이 한 단어가 아니에요\");\n        else if (body.indexOf(\" \" + w + \" \") < 0) issues.push(\"(\" + L + \") 정답 '\" + w + \"'가 본문에 없어요\");\n      });\n      if ((String(p.box || \"\").match(/\\([ABC]\\)/g) || []).length < 3) issues.push(\"요약문에 빈칸 (A)~(C)가 모두 있지 않아요\");\n    }\n    if (p.type === \"fix\") {\n      var spans = {}, rawSpans = {};\n      (String(p.passage).match(/<u>\\s*\\(([A-E])\\)([^]*?)<\\/u>/g) || []).forEach(function (u) {\n        var m = u.match(/<u>\\s*\\(([A-E])\\)([^]*?)<\\/u>/);\n        rawSpans[m[1]] = plainText(m[2]);\n        spans[m[1]] = rawSpans[m[1]].toLowerCase();\n      });\n      if (Object.keys(spans).length !== 5) issues.push(\"밑줄 기호 (A)~(E)가 \" + Object.keys(spans).length + \"개예요\");\n      // 한 문장 전체: 대문자(또는 따옴표·숫자)로 시작해 마침표·물음표·느낌표로 끝나야 한다.\n      var partial = Object.keys(rawSpans).filter(function (L) { return !/^[\"'(]?[A-Z0-9]/.test(rawSpans[L]) || !/[.!?][\"')]?$/.test(rawSpans[L]); });\n      if (partial.length) issues.push(\"(\" + partial.join(\"), (\") + \")가 문장 전체에 밑줄이 그어지지 않았어요\");\n      if (original) {\n        var countWords = function (t) { return plainText(t).replace(/\\(([A-E])\\)/g, \" \").split(/\\s+/).filter(Boolean).length; };\n        var have = countWords(p.passage), want = countWords(original);\n        if (want && have < want * 0.9) issues.push(\"지문이 원문보다 짧아요 (원문 \" + want + \"단어, 지문 \" + have + \"단어)\");\n      }\n      var fixes = String(p.answer || \"\").match(/\\(([A-E])\\)\\s*([^\\s,→\\-]+)\\s*(?:→|->|-)\\s*([^\\s,/]+)/g) || [];\n      if (fixes.length !== 2) issues.push(\"고친 곳이 2개가 아니에요 (\" + fixes.length + \"개)\");\n      fixes.forEach(function (f) {\n        var m = f.match(/\\(([A-E])\\)\\s*([^\\s,→\\-]+)\\s*(?:→|->|-)\\s*([^\\s,/]+)/);\n        var span = spans[m[1]];\n        if (span !== undefined && (\" \" + span.replace(/[^a-z'\\-]+/g, \" \") + \" \").indexOf(\" \" + m[2].toLowerCase() + \" \") < 0) issues.push(\"(\" + m[1] + \")의 틀린 부분 '\" + m[2] + \"'가 밑줄 안에 없어요\");\n      });\n    }\n    if (!plainText(p.passage)) issues.push(\"지문이 비어 있어요\");\n    return issues;\n  }\n\n  // 너무 쉬운 어법 포인트: 틀린 단어 바로 앞이 조동사인 경우(will being, can goes 같은 것)\n  var MODALS = /\\b(?:will|would|can|could|shall|should|may|might|must)\\s+(?:not\\s+)?$/i;\n  function trivialGrammar(p) {\n    var hits = [];\n    if (p.type === \"grammar\") {\n      var m = String(p.passage || \"\").match(new RegExp(\"([^<>]{0,40})<u>\\\\s*\" + p.answer + \"\\\\s*([^<]*)<\/u>\"));\n      if (m && MODALS.test(plainText(m[1]) + \" \")) hits.push(\"정답 \" + p.answer + \"가 조동사 바로 뒤 동사 형태예요. 너무 쉬운 포인트예요\");\n    }\n    if (p.type === \"fix\") {\n      var rx = /\\(([A-E])\\)\\s*([^\\s,→\\-]+)\\s*(?:→|->|-)\\s*([^\\s,/]+)/g, f;\n      var text = plainText(p.passage);\n      while ((f = rx.exec(String(p.answer || \"\"))) !== null) {\n        var idx = text.indexOf(\" \" + f[2] + \" \");\n        if (idx < 0) idx = text.indexOf(\" \" + f[2]);\n        if (idx >= 0 && MODALS.test(text.slice(Math.max(0, idx - 30), idx + 1))) hits.push(\"(\" + f[1] + \") '\" + f[2] + \"'는 조동사 바로 뒤 동사 형태예요. 너무 쉬운 포인트예요\");\n      }\n    }\n    return hits;\n  }\n\n  // \"(A) word (B) word (C) word\" → {A: \"word\", ...}\n  function parseLetteredAnswer(text, letters) {\n    var out = {};\n    var s2 = plainText(text);\n    letters.forEach(function (L, i) {\n      var next = letters[i + 1];\n      var re = new RegExp(\"\\\\(\" + L + \"\\\\)\\\\s*(.*?)\\\\s*(?=\" + (next ? \"\\\\(\" + next + \"\ 는 <b>…<\/b> 태그만 씁니다.\",\n      \"\",\n      \"## 출력 형식\",\n      \"설명 없이 JSON만 출력합니다.\",\n      '{\"reviews\":[{\"id\":\"' + items[0].id + '\",\"ok\":true},{\"id\":\"…\",\"ok\":false,\"issue\":\"②도 정답이 될 수 있음\",\"fix\":{\"choices\":[\"…\",\"…\",\"…\",\"…\",\"…\"],\"explanation\":\"…\"}}]}',\n      \"\",\n      \"## 검수할 문제\",\n      body.join(\"\\n\\n\")\n    ].join(\"\\n\");\n  }\n\n  // 검수 결과를 문제에 반영한다. byId: {id: problem}. 돌려주는 값: {checked, fixed, notes}\n  function applyReview(text, byId) {\n    var reviews = [];\n    extractJsonAll(text).forEach(function (d) {\n      var list = Array.isArray(d) ? d : d.reviews;\n      if (Array.isArray(list)) reviews = reviews.concat(list);\n    });\n    var result = { checked: 0, fixed: 0, notes: [] };\n    reviews.forEach(function (r) {\n      var p = r && byId[String(r.id)];\n      if (!p) return;\n      result.checked++;\n      p.reviewed = true;\n      if (r.ok === false && r.fix && typeof r.fix === \"object\") {\n        var f = r.fix, changed = false;\n        // 선지는 원래 선지가 있는 객관식 문제에만 바꾼다(어법·어휘처럼 지문 속 번호 문제는 선지가 없다).\n        if (Array.isArray(p.choices) && Array.isArray(f.choices) && f.choices.length === 5) { p.choices = f.choices.map(String); changed = true; }\n        if (f.answer) { p.answer = normalizeAnswer(f.answer); changed = true; }\n        [\"explanation\", \"passage\", \"box\", \"instruction\"].forEach(function (k) { if (typeof f[k] === \"string\" && f[k].trim()) { p[k] = f[k]; changed = true; } });\n        if (changed) {\n          result.fixed++;\n          p.reviewNote = String(r.issue || \"검수에서 고침\");\n          result.notes.push(p.reviewNote);\n        }\n      } else if (r.ok === false) {\n        p.reviewNote = String(r.issue || \"확인 필요\");\n        result.notes.push(p.reviewNote + \" (고친 내용 없음)\");\n      }\n    });\n    return result;\n  }\n\n  // ---------- 문제 정렬 ----------\n\n  // 문제를 정렬하고 각 문제에 회차(round, 0부터)를 매긴다.\n  // 회차: 같은 지문·같은 유형에서 몇 번째로 만든 문제인가.\n  // 기본: 유형 → 회차 → 지문 순서. 즉 유형 안에서 지문들이 1회   // 정답을 t번(0~4)으로 옮긴다. 해설 속 원문자 번호도 함께 바꾼다.\n  function moveAnswer(p, t) {\n    var cur = CIRCLED.indexOf(p.answer);\n    if (cur < 0 || cur === t) return p;\n    if (p.type === \"order\") {\n      var byLabel = {};\n      String(p.passage).split(\"\\n\").forEach(function (line) { byLabel[line.slice(0, 3)] = line.slice(4); });\n      var oldPerm = ORDER_PERMS[cur], newPerm = ORDER_PERMS[t];\n      var chunks = oldPerm.map(function (li) { return byLabel[LABELS[li]]; }); // 실제 순서대로의 덩어리\n      var relabeled = [];\n      for (var pos = 0; pos < 3; pos++) relabeled[newPerm[pos]] = chunks[pos];\n      p.passage = relabeled.map(function (text, li) { return LABELS[li] + \" \" + text; }).join(\"\\n\");\n      p.explanation = \"주어진 글 → \" + newPerm.map(function (x) { return LABELS[x]; }).join(\" → \");\n    } else if (p.type === \"insert\") {\n      p.passage = insertPassage(p.meta.remaining, p.meta.removed - t, p.meta.markers);\n    } else {\n      var tmp = p.choices[cur];\n      p.choices[cur] = p.choices[t];\n      p.choices[t] = tmp;\n      if (p.explanation) {\n        p.explanation = p.explanation.replace(/[①-⑤]/g, function (c) {\n          var i = CIRCLED.indexOf(c);\n          return i === cur ? CIRCLED[t] : i === t ? CIRCLED[cur] : c;\n        });\n      }\n    }\n    p.answer = CIRCLED[t];\n    return p;\n  }\n\n  function sourceKey(p) {\n    return p.source ? (p.source.exam || \"\") + \"\\u0001\" + p.source.no + \"\\u0001\" + (p.round || 0) : null;\n  }\n\n  // 문제지 전체에서 정답 번호가 ①~⑤ 골고루 나오도록 맞춘다. problems는 문제지 순서대로.\n  // shouldMove(p)가 참인 문제만 옮기고(없으면 옮길 수 있는 문제 전부), 나머지는 있는 그대로 둔다.\n  //\n  // 1) 옮기지 않는 문제의 정답 개수를 세고, 전체가 고르게 되려면 옮길 문제에 번호별로 몇 개씩 줘야 하는지 정한다.\n  // 2) 그 몫을 문제지 처음부터 끝까지 고르게 나눠 쓴다(부족한 번호를 앞쪽에 몰아 쓰지 않는다).\n  // 3) 바로 앞·뒤 문제와 같은 번호는 다른 번호를 고를 수 없을 때만 쓰고,\n  //    두 문제 앞과 같은 번호(①⑤①⑤ 같은 되풀이)도 피하며, 나머지는 무작위로 섞어 주기적인 되풀이가 생기지 않게 한다.\n  function balanceAnswers(problems, shouldMove, rng) {\n    rng = rng || makeRng();\n    var n = problems.length;\n    var | \"(\" + (i + 1) + \")\"; }\n\n  // ---------- 분석 보관 ----------\n\n  // 같은 지문(같은 문장 나누기)이면 같은 키. AI 분석 결과를 다시 쓰는 데 쓴다.\n  function passageKey(sentences) {\n    var s = sentences.join(\"\\n\"), h = 5381;\n    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;\n    return h.toString(36) + \"-\" + sentences.length;\n  }\n\n  // 고른 활동에 필요한 분석 항목 중 아직 없는 것\n  function missingNeeds(analysis, types) {\n    var out = [];\n    types.forEach(function (t) {\n      (BY_KEY[t] ? BY_KEY[t].needs : []).forEach(function (n) {\n        if (out.indexOf(n) < 0 && !(analysis && analysis[n])) out.push(n);\n      });\n    });\n    return out;\n  }\n\n  // ---------- 낱말 다루기 ----------\n\n  function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\"); }\n\n  // 문장 안에서 낱말(구)이 나오는 자리들. 앞뒤가 알파벳이면 낱말 일부이므로 뺀다.\n  function findAll(sentence, phrase, ignoreCase) {\n    var out = [];\n    if (!phrase) return out;\n    var re = new RegExp(\"(?<![A-Za-z])\" + escapeRe(phrase) + \"(?![A-Za-z])\", ignoreCase ? \"gi\" : \"g\");\n    var m;\n    while ((m = re.exec(sentence)) !== null) out.push({ start: m.index, end: m.index + m[0].length });\n    return out;\n  }\n\n  var STOPWORDS = (\"about above across after again against along already also although always among another anyone anything around because become becomes been before behind being below between beyond both cannot could didn't doesn't during either enough especially even every everyone everything example first former however instead itself just later latter least less little many might more most much must myself neither never nothing often other others otherwise ourselves perhaps rather really same seems several should since something sometimes still such than that their theirs them themselves then there therefore these they thing things this those though through thus together toward towards under unless until upon very what whatever when whenever where whether which while whom whose will with within without would yourself people\").split(\" \");\n\n  // 빈칸으로 만들 만한 낱말: 5글자 이상 소문자 낱말 중 기능어가 아닌 것\n  function blankCandidates(sentence) {\n    var out = [], re = /[A-Za-z][A-Za-z'-]*/g, m;\n    while ((m = re.exec(sentence)) !== null) {\n      var w = m[0];\n      if (w.length < 5 || !/^[a-z]+$/.test(w) || STOPWORDS.indexOf(w) >= 0) continue;\n      out.push({ word: w, start: m.index, end: m.index + w.length });\n    }\n    return out;\n  }\n\n  // ---------- 자동 활동 ----------\n\n  // 빈칸 채우기: 문장마다 빈칸을 넣고 해석을 함께 준다. 분석에 어휘(지문 속 형태)가 있으면 그 낱말을 먼저 빈칸으로 만든다.\n  function makeBlank(sentences, rng, analysis) {\n    var wanted = Math.max(5, Math.min(14, sentences.length + 2));\n    var picks = sentences.map(function () { return []; });\n    var count = 0;\n    function overlaps(i, pos) { return picks[i].some(function (p) { return pos.start < p.end && p.start < pos.end; }); }\n    function add(i, pos, word) {\n      if (count >= wanted || overlaps(i, pos) || picks[i].length >= 2) return false;\n      picks[i].push({ start: pos.start, end: pos.end, word: word });\n      count++;\n      return true;\n    }\n    var vocab = (analysis && analysis.vocab) || [];\n    vocab.forEach(function (v) {\n      if (!v.form || /\\s/.test(v.form)) return;\n      for (var i = 0; i < sentences.length; i++) {\n        var at = findAll(sentences[i], v.form, false)[0];\n        if (at && add(i, at, v.form)) return;\n      }\n    });\n    // 문장마다 고르게: 한 바퀴에 문장당 하나씩, 긴 낱말을 조금 더 자주 고른다.\n    for (var round = 0; round < 2 && count < wanted; round++) {\n      rng.shuffle(sentences.map(function (_, i) { return i; })).forEach(function (i) {\n        if (count >= wanted || picks[i].length > round) return;\n        var cands = blankCandidates(sentences[i]).filter(function (c) { return !overlaps(i, c); });\n        if (!cands.length) return;\n        cands.sort(function (a, b) { return b.word.length - a.word.length; });\n        var c = cands[Math.floor(rng.next() * Math.min(3, cands.length))];\n        add(i, c, c.word);\n      });\n    }\n    if (!count) throw new Error(\"빈칸으로 만들 낱말을 찾지 못했어요.\");\n    var n = 0, answers = [];\n    var lines = sentences.map(function (s, i) {\n      var list = picks[i].slice().sort(function (a, b) { return a.start - b.start; });\n      var out = \"\", last = 0;\n      list.forEach(function (p) {\n        n++;\n        answers.push(p.word);\n        out += s.slice(last, p.start) + \"<b>(\" + n + \")<\/b> \" + p.word.charAt(0) + \"__________\";\n        last = p.end;\n      });\n      return out + s.slice(last);\n    });\n    return { sentences: lines, translations: ((analysis && analysis.translations) || []).slice(), answers: answers };\n  }\n\n  // 원래 순서와 다르게 섞는다.\n  function shuffleApart(arr, rng) {\n    if (arr.length < 2) return arr.slice();\n    for (var t = 0; t < 20; t++) {\n      var s = rng.shuffle(arr);\n      if (s.some(function (x, i) { return x !== arr[i]; })) return s;\n    }\n    return arr.slice(1).concat(arr[0]);\n  }\n\n  var ORDER_LABELS = [\"(A)\", \"(B)\", \"(C)\", \"(D)\", \"(E)\", \"(F)\", \"(G)\", \"(H)\"];\n\n  // 문장 순서 배열: 첫 문장을 주고, 나머지를 (A)~(H) 덩어리로 섞는다.\n  function makeOrder(sentences, rng) {\n    if (sentences.length < 4) throw new Error(\"문장이 4개 이상이어야 순서 배열을 만들 수 있어요.\");\n    var rest = sentences.slice(1);\n    var size = Math.ceil(rest.length / ORDER_LABELS.length);\n    var chunks = [];\n    for (var i = 0; i < rest.length; i += size) chunks.push(rest.slice(i, i + size).join(\" \"));\n    var shuffled = shuffleApart(chunks.map(function (_, k) { return k; }), rng);\n    var label = {};\n    shuffled.forEach(function (k, pos) { label[k] = ORDER_LABELS[pos]; });\n    return {\n      given: sentences[0],\n      chunks: shuffled.map(function (k, pos) { return { label: ORDER_LABELS[pos], text: chunks[k] }; }),\n      answer: chunks.map(function (_, k) { return label[k]; }).join(\" - \")\n    };\n  }\n\n  // 단어 배열: 문장마다 낱말(긴 문장은 2~3낱말 덩어리)을 섞는다. 해석이 있으면 우리말을 함께 준다.\n  function makeScramble(sentences, rng, analysis) {\n    var tr = (analysis && analysis.translations) || [];\n    var items = [];\n    sentences.forEach(function (s, i) {\n      var end = (s.match(/[.!?]+[\"')\\]]*$/) || [\"\"])[0];\n      var words = s.slice(0, s.length - end.length).trim().split(/\\s+/);\n      if (words.length < 5) return;\n      if (words[0] !== \"I\" && /^[A-Z][a-z'-]*$/.test(words[0])) words[0] = words[0].toLowerCase();\n      var size = Math.ceil(words.length / 10);\n      var chunks = [];\n      for (var k = 0; k < words.length; k += size) chunks.push(words.slice(k, k + size).join(\" \"));\n      items.push({ no: i, hint: tr[i] || \"\", chunks: shuffleApart(chunks, rng).join(\" / \"), answer: s });\n    });\n    if (!items.length) throw new Error(\"배열할 만한 문장(5단어 이상)이 없어요.\");\n    return { items: items };\n  }\n\n  // ---------- AI 활동 ----------\n\n  // [정답 / 오답] 선택지를 지문에 넣는다. items: [{s, answer, wrong, point}] (s는 1부터)\n  function makeChoice(sentences, items, rng) {\n    var marks = sentences.map(function () { return []; });\n    items.forEach(function (it) {\n      var i = it.s - 1;\n      var free = findAll(sentences[i], it.answer, false).filter(function (pos) {\n        return !marks[i].some(function (m) { return pos.start < m.end && m.start < pos.end; });\n      })[0];\n      if (free) marks[i].push({ start: free.start, end: free.end, item: it });\n    });\n    var n = 0, answers = [];\n    var text = sentences.map(function (s, i) {\n      var out = \"\", last = 0;\n      marks[i].sort(function (a, b) { return a.start - b.start; }).forEach(function (m) {\n        n++;\n        var pair = rng.next() < 0.5 ? [m.item.answer, m.item.wrong] : [m.item.wrong, m.item.answer];\n        answers.push({ answer: m.item.answer, point: m.item.point || \"\" });\n        out += s.slice(last, m.start) + \"<b>(\" + n + \") [\" + pair[0] + \" / \" + pair[1] + \"]<\/b>\";\n        last = m.end;\n      });\n      return out + s.slice(last);\n    }).join(\" \");\n    if (!n) throw new Error(\"지문에서 선택지를 넣을 자리를 찾지 못했어요.\");\n    return { text: text, answers: answers };\n  }\n\n  // 활동 하나를 만든다. 분석이 모자라면 오류를 낸다.\n  function makeActivity(type, sentences, analysis, rng) {\n    var a = analysis || {};\n    var lack = missingNeeds(a, [type]);\n    if (lack.length) throw new Error(\"AI 분석(\" + lack.join(\", \") + \")이 아직 없어요.\");\n    switch (type) {\n      case \"study\": return {\n        sentences: sentences.slice(), translations: a.translations.slice(),\n        rows: a.vocab.map(function (v) { return { word: v.word, pos: v.pos || \"\", meaning: v.meaning }; })\n      };\n      case \"grammar\": return makeChoice(sentences, a.grammar, rng);\n      case \"lexical\": return makeChoice(sentences, a.lexical, rng);\n      case \"blank\": return makeBlank(sentences, rng, a);\n      case \"order\": return makeOrder(sentences, rng);\n      case \"scramble\": return makeScramble(sentences, rng, a);\n      case \"translate\": return { sentences: sentences.slice(), translations: a.translations.slice() };\n      case \"compose\": return { sentences: sentences.slice(), translations: a.translations.slice() };\n    }\n    throw new Error(\"알 수 없는 활동: \" + type);\n  }\n\n  // ---------- AI 요청문 ----------\n\n  var NEED_GUIDE = {\n    translations: '\"translations\": 문장마다 우리말 해석 하나씩. 개수는 그 지문의 문장 수와 꼭 같게, 번호 순서대로. 영어 구조가 보이도록 직역에 가깝게 하되 자연스러운 우리말로 쓴다.',\n    vocab: '\"vocab\": 고2~고3 학생이 꼭 알아야 할 단어·숙어 12~16개를 지문에 나온 순서대로. 각 항목은 {\"word\": 사전에 싣는 기본형(숙어는 원형), \"form\": 지문에 나온 그대로의 형태(대소문자까지 똑같이), \"pos\": \"n.\" \"v.\" \"a.\" \"ad.\" \"prep.\" \"conj.\" \"phr.\" 중 하나, \"meaning\": 이 지문 문맥의 우리말 뜻(쉼표로 2개까지)}. a, the, is 같은 쉬운 낱말은 넣지 않는다.',\n    grammar: '\"grammar\": 어법 선택 6~8개. 각 항목은 {\"s\": 문장 번호, \"answer\": 지문에 실제로 쓰인 형태(지문에서 글자 그대로 찾을 수 있는 1~3단어), \"wrong\": 학생이 헷갈릴 만한 틀린 형태, \"point\": 출제 포인트 한 줄(우리말)}. 한 문장에 2개까지, 지문 전체에 고르게 둔다. 포인트: 멀리 떨어진 주어-동사 수일치, 본동사 vs 준동사, 능동 vs 수동, 현재분사 vs 과거분사, 관계대명사 that/what/which, 관계대명사 vs 관계부사, 병렬 구조, 대명사의 수·재귀대명사, 형용사 vs 부사, to부정사 vs 동명사, 도치 등. 조동사 뒤 동사원형, 철자처럼 너무 쉬운 포인트는 쓰지 않는다.',\n    lexical: '\"lexical\": 문맥상 알맞은 낱말 고르기 5~7개. 각 항목은 {\"s\": 문장 번호, \"answer\": 지문에 실제로 쓰인 낱말(1단어, 글자 그대로), \"wrong\": 문맥에 맞지 않는 낱말(반의어나 철자·뜻이 비슷한 낱말), \"point\": 고르는 근거 한 줄(우리말)}. 글의 흐름을 이해해야 고를 수 있는 내용어를 고른다.'\n  };\n  var NEED_ORDER = [\"translations\", \"vocab\", \"grammar\", \"lexical\"];\n\n  // passages: [{key, sentences}], needs: 만들 항목\n  function buildAnalysisPrompt(passages, needs) {\n    needs = NEED_ORDER.filter(function (n) { return needs.indexOf(n) >= 0; });\n    var lines = [\n      \"너는 한국 고등학교 영어 교사다. 아래 영어 지문으로 학생용 워크북 자료를 만든다.\",\n      \"지문의 문장은 프로그램이 이미 나누고 번호를 붙였다. 문장을 합치거나 나누지 말고 이 번호를 그대로 쓴다.\",\n      \"\"\n    ];\n    passages.forEach(function (p) {\n      lines.push(\"[지문 \" + p.key + \"] (\" + p.sentences.length + \"문장)\");\n      p.sentences.forEach(function (s, i) { lines.push((i + 1) + \". \" + s); });\n      lines.push(\"\");\n    });\n    lines.push(\"지문마다 다음 항목을 만든다.\");\n    needs.forEach(function (n) { lines.push(\"- \" + NEED_GUIDE[n]); });\n    lines.push(\"\");\n    lines.push(\"지문에서 가져오는 낱말(form, answer)은 지문의 글자와 한 글자도 다르지 않게 쓴다.\");\n    var example = { key: passages[0] ? passages[0].key : \"1\" };\n    needs.forEach(function (n) { example[n] = []; });\n    lines.push(\"다른 말 없이 JSON 하나만 답한다. 형식: \" + JSON.stringify({ passages: [example] }));\n    return lines.join(\"\\n\");\n  }\n\n  // AI 답변을 읽는다. sentencesByKey: {key: 문장 목록}\n  // 돌려주는 값: {results: {key: {translations?, vocab?, grammar?, lexical?}}, warnings}\n  function parseAnalysis(text, sentencesByKey) {\n    var list = [];\n    VM.extractJsonAll(text).forEach(function (data) {\n      if (Array.isArray(data.passages)) list = list.concat(data.passages);\n      else if (data.translations || data.vocab || data.grammar || data.lexical) list.push(data);\n    });\n    if (!list.length) throw new Error(\"AI 답변에 passages 목록이 없어요.\");\n    var keys = Object.keys(sentencesByKey);\n    var results = {}, warnings = [];\n    list.forEach(function (raw, idx) {\n      var key = raw.key != null && sentencesByKey[String(raw.key)] ? String(raw.key) : (keys.length === 1 ? keys[0] : keys[idx]);\n      var sents = sentencesByKey[key];\n      if (!sents) return;\n      var label = \"지문 \" + key;\n      var out = {};\n      if (Array.isArray(raw.translations)) {\n        var tr = raw.translations.map(function (t) { return String(t == null ? \"\" : t).trim(); });\n        if (tr.length !== sents.length) warnings.push(label + \": 해석이 \" + tr.length + \"개예요(문장 \" + sents.length + \"개). 빠진 해석은 비워 두었어요.\");\n        out.translations = sents.map(function (_, i) { return tr[i] || \"\"; });\n      }\n      if (Array.isArray(raw.vocab)) {\n        var whole = sents.join(\" \");\n        out.vocab = raw.vocab.filter(function (v) { return v && v.word && v.meaning; }).map(function (v) {\n          var form = v.form && findAll(whole, String(v.form), false).length ? String(v.form) : \"\";\n          return { word: String(v.word).trim(), form: form, pos: String(v.pos || \"\").trim(), meaning: String(v.meaning).trim() };\n        });\n        if (!out.vocab.length) warnings.push(label + \": 어휘 목록이 비어 있어요.\");\n      }\n      [\"grammar\", \"lexical\"].forEach(function (field) {\n        if (!Array.isArray(raw[field])) return;\n        var dropped = 0;\n        out[field] = raw[field].map(function (it) {\n          if (!it || !it.answer || !it.wrong) return null;\n          var answer = String(it.answer).trim(), wrong = String(it.wrong).trim();\n          if (answer.toLowerCase() === wrong.toLowerCase()) return null;\n          var s = parseInt(it.s, 10);\n          // 문장 번호가 틀렸으면 그 낱말이 있는 다른 문장을 찾는다.\n          if (!(s >= 1 && s <= sents.length && findAll(sents[s - 1], answer, false).length)) {\n            s = 0;\n            for (var i = 0; i < sents.length && !s; i++) if (findAll(sents[i], answer, false).length) s = i + 1;\n          }\n          return s ? { s: s, answer: answer, wrong: wrong, point: String(it.point || \"\").trim() } : null;\n        }).filter(function (it) { if (!it) dropped++; return it; });\n        if (dropped) warnings.push(label + \" \" + (field === \"grammar\" ? \"어법\" : \"어휘\") + \" 선택: 지문에서 찾지 못한 \" + dropped + \"개는 뺐어요.\");\n      });\n      results[key] = out;\n    });\n    if (!Object.keys(results).length) throw new Error(\"답변의 지문 번호(key)가 요청문과 맞지 않아요.\");\n    return { results: results, warnings: warnings };\n  }\n\n  // ---------- 워크북 구성 ----------\n\n  // 쓰는 줄. 2단이면 짧게.\n  function writeLine(columns) { return \"→ \" + new Array(columns === 2 ? 44 : 96).join(\"_\"); }\n\n  function plain(text, role) { var r = { text: text, u: false, b: false }; if (role) r.role = role; return r; }\n  function bold(text) { return { text: text, u: false, b: true }; }\n\n  // 지문 출처: 교재 이름 + 지문 번호 (예: 올림포스2 독해의 기본 11강 Practice 3)\n  function sourceText(src) {\n    if (!src) return \"\";\n    return (src.exam ? src.exam + \" \" : \"\") + VM.noLabel(src.no);\n  }\n\n  // 활동 하나의 본문 블록\n  function activityBlocks(item, columns) {\n    var d = item.data, out = [];\n    var line = writeLine(columns);\n    function sentenceBlock(i, text) { return { kind: \"choice\", runs: [plain(sentMark(i) + \" \")].concat(VM.parseRuns(text)) }; }\n    function translationBlock(t) { return { kind: \"answerLine\", runs: [plain(t || \"\", \"explain\")] }; }\n    switch (item.type) {\n      case \"study\":\n        d.sentences.forEach(function (s, i) {\n          out.push(sentenceBlock(i, s));\n          out.push(translationBlock(d.translations[i]));\n        });\n        if (d.rows.length) {\n          out.push({ kind: \"src\", runs: [plain(\"단어 정리\")] });\n          out.push({ kind: \"answerTable\", runs: [], span: 1, widths: [7, 33, 10, 50], header: [\"번호\", \"단어\", \"품사\", \"뜻\"],\n            rows: d.rows.map(function (v, i) { return [String(i + 1), v.word, v.pos, v.meaning]; }) });\n        }\n        break;\n      case \"blank\":\n        d.sentences.forEach(function (s, i) {\n          out.push(sentenceBlock(i, s));\n          out.push(translationBlock(d.translations[i]));\n        });\n        break;\n      case \"grammar\":\n      case \"lexical\":\n        out.push({ kind: \"para\", runs: VM.parseRuns(d.text) });\n        break;\n      case \"order\":\n        out.push({ kind: \"box\", runs: [plain(d.given)] });\n        d.chunks.forEach(function (c) { out.push({ kind: \"choice\", runs: [bold(c.label + \" \"), plain(c.text)] }); });\n        out.push({ kind: \"answerLine\", runs: [plain(\"답: \" + d.chunks.map(function () { return \"(    )\"; }).join(\" → \"))] });\n        break;\n      case \"scramble\":\n        d.items.forEach(function (it, k) {\n          out.push({ kind: \"choice\", runs: [plain(sentMark(k) + \" \")].concat(it.hint ? [plain(it.hint)] : [plain(\"(본문 \" + sentMark(it.no) + \" 문장)\", \"explain\")]) });\n          out.push({ kind: \"box\", runs: [plain(it.chunks)] });\n          out.push({ kind: \"answerLine\", runs: [plain(line)] });\n        });\n        break;\n      case \"translate\":\n        d.sentences.forEach(function (s, i) {\n          out.push(sentenceBlock(i, s));\n          out.push({ kind: \"answerLine\", runs: [plain(line)] });\n          if (s.split(/\\s+/).length > 18) out.push({ kind: \"answerLine\", runs: [plain(line)] });\n        });\n        break;\n      case \"compose\":\n        d.translations.forEach(function (t, i) {\n          out.push(sentenceBlock(i, t || \"(해석 없음)\"));\n          out.push({ kind: \"answerLine\", runs: [plain(line)] });\n          if (d.sentences[i].split(/\\s+/).length > 14) out.push({ kind: \"answerLine\", runs: [plain(line)] });\n        });\n        break;\n    }\n    return out;\n  }\n\n  // 정답지에 싣는 줄들(없으면 빈 목록)\n  function answerLines(item) {\n    var d = item.data;\n    switch (item.type) {\n      case \"grammar\":\n      case \"lexical\":\n        return d.answers.map(function (a, i) { return \"(\" + (i + 1) + \") <b>\" + a.answer + \"<\/b>\" + (a.point ? \"  \" + a.point : \"
