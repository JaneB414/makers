age .k-ask.first { margin-top: 18px; }\n.page .k-ask .r-num { font: 700 17.33px/1 var(--en); color: var(--navy); }\n.page .k-para { text-align: justify; hyphens: auto; }\n.page .k-box { background: var(--box-fill); padding: 1px 9px; text-align: justify; }\n.page .k-box.first { padding-top: 6px; margin-top: 4px; }\n.page .k-box.last { padding-bottom: 6px; margin-bottom: 6px; }\n.page .k-choice { padding-left: 1.35em; text-indent: -1.35em; line-height: 1.55; }\n.page .k-choice.first { margin-top: 6px; }\n.page .k-answerLine { margin: 6px 0 0 27px; }\n.page .k-ansTitle { font: 700 18.67px/1.4 var(--en), var(--kr-serif); text-align: center; margin-bottom: 10px; }\n.page .k-roundTitle { font: 700 18.67px/1.4 var(--en), var(--kr-serif); text-align: center; color: var(--navy); margin: 4px 0 2px; }\n.page .k-typeHead { font: 700 14px/1.4 var(--kr-sans); color: var(--navy); border-bottom: 1.3px solid var(--navy); padding-bottom: 3px; margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; }\n.page .k-typeHead:first-child { margin-top: 2px; }\n.page .r-typeRange { font: 400 10.67px var(--kr-sans); color: var(--src-gray); letter-spacing: .02em; }\n.page .r-tag { display: inline-block; font: 700 10.67px/1.5 var(--kr-sans); color: var(--navy); background: var(--tag-fill); padding: 0 2px; margin-left: 2px; border-radius: 2px; white-space: nowrap; vertical-align: 1px; }\n.p-full:empty { display: none; }\n.p-full { margin-bottom: 12px; }\n.page .answer-grid { width: 100%; border-collapse: collapse; table-layout: fixed; margin: 4px 0 6px; font-variant-numeric: tabular-nums; }\n.page .answer-grid td { border: 1px solid #aeb6c4; text-align: center; padding: 2px 0; line-height: 1.35; }\n.page .answer-grid .g-num { background: #eef1f6; font: 11.33px var(--kr-sans); color: #333; width: 4.5%; }\n.page .answer-grid .g-ans { font: 12.67px var(--en), var(--kr-serif); width: 5.5%; }\n.page .k-gridCaption { font: 700 12.67px/1.4 var(--kr-sans); color: var(--navy); margin: 8px 0 2px; }\n.page .answer-table { border-collapse: collapse; margin: 6px 0 2px; width: 100%; table-layout: fixed; }\n.page .answer-table th, .page .answer-table td { border: 1px solid #aeb6c4; text-align: center; font: 10.67px/1.4 var(--kr-sans); }\n.page .answer-table th { background: #eef1f6; color: #333; font-weight: 400; padding: 3px 2px; }\n.page .answer-table th:first-child { width: 22%; }\n.page .answer-table td { height: 26px; }\n.page .k-ans { font-size: 12.67px; line-height: 1.5; padding-left: 1.8em; text-indent: -1.8em; margin-bottom: 2px; }\n.page .r-ansNum { color: var(--navy); font-weight: 700; }\n.page .r-explain { color: #444; font-size: 11.33px; }\n.page .tools { position: absolute; right: 0; top: -2px; display: flex; gap: 3px; }\n.page .tools button { font: 11px var(--ui); padding: 1px 6px; background: #fff; color: #555; border-color: #ccc; }\n.pdf-mode .tools { display: none; }\n.page-empty { color: #777; font: 14px var(--ui); text-align: center; padding-top: 60px; }\n.chip .chip-text { padding: 4px 10px 4px 6px; cursor: pointer; }\n.coverage { display: grid; gap: 2px; font-size: 13px; border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }\n.coverage p { margin: 0; }\n.coverage .cov-title { font-weight: 600; margin-bottom: 4px; }\n.coverage .cov-row.done b { color: var(--ok); }\n.coverage .cov-row.miss b { color: var(--warn); }\n.coverage .cov-row span { color: var(--muted); }\n.inline-select { width: auto; padding: 2px 6px; font-size: 13px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>영어 변형문제 메이커<\/h1>\n    <p>교재별로 지문을 등록해 두고, 원하는 지문을 골라 변형문제를 만들어 한글·PDF 파일로 저장합니다.<\/p>\n  <\/header>\n\n  <div class=\"layout\">\n    <div class=\"stack\">\n      <section class=\"panel\" aria-labelledby=\"h-lib\">\n        <h2 id=\"h-lib\"><span class=\"step\">1<\/span>지문 보관함<\/h2>\n        <p class=\"hint\">교재별로 지문을 등록해 두는 곳이에요. 모의고사 한 회, 수능특강 같은 교재 하나를 ‘교재’로 만들고 그 아래에 지문을 넣으세요.<\/p>\n\n        <div class=\"row\">\n          <label class=\"field grow\" for=\"exam\">교재\n            <select id=\"exam\"><\/select>\n          <\/label>\n          <button type=\"button\" id=\"exam-new\">새 교재<\/button>\n          <button type=\"button\" id=\"exam-rename\">이름 바꾸기<\/button>\n          <button type=\"button\" id=\"exam-delete\">삭제<\/button>\n        <\/div>\n        <div class=\"row\" id=\"exam-form\" hidden>\n          <label class=\"field grow\" for=\"exam-name\"><span id=\"exam-form-label\">새 교재 이름<\/span>\n            <input type=\"text\" id=\"exam-name\" placeholder=\"예: 26년 9월 고2 모의고사, 수능특강 영어\">\n          <\/label>\n          <button type=\"button\" class=\"primary\" id=\"exam-save\">확인<\/button>\n          <button type=\"button\" id=\"exam-cancel\">취소<\/button>\n        <\/div>\n        <div class=\"msg warn\" id=\"exam-confirm\" hidden>\n          <span id=\"exam-confirm-text\"><\/span>\n          <button type=\"button\" id=\"exam-confirm-yes\">삭제<\/button>\n          <button type=\"button\" id=\"exam-confirm-no\">취소<\/button>\n        <\/div>\n\n        <div class=\"chips\" id=\"chips\"><\/div>\n        <p class=\"hint\" id=\"chips-count\"><\/p>\n\n        <div class=\"editor\">\n          <div class=\"row\">\n            <label class=\"field\" for=\"p-no\" style=\"width:120px\">지문 번호\n              <input type=\"text\" id=\"p-no\" placeholder=\"29, 3강 1번\">\n            <\/label>\n            <div class=\"row end\">\n              <button type=\"button\" class=\"primary\" id=\"p-save\">지문 저장<\/button>\n              <button type=\"button\" id=\"p-new\">새 지문<\/button>\n              <button type=\"button\" id=\"p-delete\">지문 삭제<\/button>\n            <\/div>\n          <\/div>\n          <label class=\"field\" for=\"passage\">영어 지문\n            <textarea id=\"passage\" rows=\"7\" spellcheck=\"false\"><\/textarea>\n          <\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"by-line\"> 한 줄에 한 문장씩 나눠 넣었어요<\/label>\n          <details>\n            <summary id=\"sent-summary\">문장 나누기 확인<\/summary>\n            <ol class=\"sentences\" id=\"sentences\"><\/ol>\n            <p class=\"hint\">문장이 잘못 나뉘었으면 지문을 한 줄에 한 문장씩 적고 위 칸을 체크하세요.<\/p>\n          <\/details>\n        <\/div>\n        <div id=\"lib-status\" class=\"msg\" hidden><\/div>\n\n        <details>\n          <summary>여러 지문 한꺼번에 등록<\/summary>\n          <div class=\"sub\">\n            <p class=\"hint\">지문마다 번호 줄을 먼저 쓰고 그 아래에 지문을 붙여 넣으세요. 번호 줄은 <code>[18]<\/code>, <code>18번<\/code>, <code>[3강 1번]<\/code>처럼 씁니다. 같은 번호가 이미 있으면 새 지문으로 바꿔요.<\/p>\n            <textarea id=\"bulk\" rows=\"6\" spellcheck=\"false\" placeholder=\"[18]&#10;Dear Ms. Carter, ...&#10;&#10;[19]&#10;The morning sun ...\"><\/textarea>\n            <div class=\"row\"><button type=\"button\" id=\"bulk-add\">지금 교재에 등록<\/button><\/div>\n          <\/div>\n        <\/details>\n        <details>\n          <summary>보관함 백업<\/summary>\n          <div class=\"sub\">\n            <p class=\"hint\">보관함은 이 브라우저에만 저장돼요. 다른 컴퓨터로 옮기거나 잃어버리지 않으려면 파일로 저장해 두세요.<\/p>\n            <div class=\"row\">\n              <button type=\"button\" id=\"lib-export\">보관함 파일로 저장<\/button>\n              <label class=\"button\" for=\"lib-import\">보관함 파일 불러오기<\/label>\n              <input type=\"file\" id=\"lib-import\" accept=\".json,application/json\" hidden>\n            <\/div>\n          <\/div>\n        <\/details>\n      <\/section>\n\n      <section class=\"panel\" aria-labelledby=\"h-pick\">\n        <h2 id=\"h-pick\"><span class=\"step\">2<\/span>문제지에 넣을 지문 고르기<\/h2>\n        <p class=\"hint\">보관함의 모든 교재에서 원하는 지문을 골라요. 여러 교재의 지문을 섞어도 돼요.<\/p>\n        <div class=\"picker\" id=\"picker\"><\/div>\n        <div class=\"row between\">\n          <span class=\"hint\" id=\"pick-count\"><\/span>\n          <button type=\"button\" class=\"link\" id=\"pick-none\">모두 해제<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel\" aria-labelledby=\"h-types\">\n        <h2 id=\"h-types\"><span class=\"step\">3<\/span>유형과 개수<\/h2>\n        <p class=\"hint\"><span class=\"tag auto\">자동<\/span> 무료로 바로 만들어요. <span class=\"tag ai\">AI<\/span> Claude가 만들어요. 개수는 지문 하나당 문제 수예요.<\/p>\n        <div class=\"types\" id=\"types\"><\/div>\n        <div class=\"row\">\n          <button type=\"button\" class=\"link\" id=\"select-auto\">자동 유형만<\/button>\n          <button type=\"button\" class=\"link\" id=\"select-none\">모두 해제<\/button>\n        <\/div>\n      <\/section>\n\n      <section class=\"panel\" aria-labelledby=\"h-make\">\n        <h2 id=\"h-make\"><span class=\"step\">4<\/span>만들기<\/h2>\n        <div class=\"row\">\n          <button type=\"button\" class=\"primary\" id=\"make\">문제 만들기<\/button>\n          <button type=\"button\" id=\"stop\" hidden>멈추기<\/button>\n          <button type=\"button\" id=\"review-run\" hidden>AI로 검수하기<\/button>\n        <\/div>\n        <label class=\"check\"><input type=\"checkbox\" id=\"opt-review\" checked> AI 문제는 만든 뒤 한 번 더 검수하기 (복수 정답·정답·해설 확인)<\/label>\n        <p class=\"hint\" id=\"make-target\"><\/p>\n        <div id=\"status\" class=\"msg\" hidden><\/div>\n        <div id=\"coverage\" class=\"coverage\" hidden><\/div>\n\n        <div id=\"manual\" class=\"ai-out\" hidden>\n          <p class=\"hint\" id=\"manual-intro\">AI 유형은 Claude 채팅에서 만들어요. ① 요청문을 복사해 <a href=\"https://claude.ai/new\" target=\"_blank\" rel=\"noopener\">claude.ai<\/a>에 붙여 넣고 ② Claude의 답변 전체를 복사해 아래 칸에 붙여 넣은 뒤 ③ 불러오기를 누르세요. 요청문이 여러 개면 하나씩 차례로 보내고, 답변은 이어서 붙여 넣어도 돼요.<\/p>\n          <div id=\"prompts\" class=\"prompts\"><\/div>\n          <label class=\"field\" for=\"ai-in\">② Claude의 답변 붙여넣기\n            <textarea id=\"ai-in\" class=\"mono\" rows=\"6\" placeholder='{\"problems\":[ ... ]}'><\/textarea>\n          <\/label>\n          <div class=\"row\"><button type=\"button\" class=\"primary\" id=\"load-ai\">③ 불러오기<\/button><\/div>\n        <\/div>\n        <div id=\"review-box\" class=\"ai-out\" hidden>\n          <p class=\"hint\">불러온 AI 문제를 한 번 더 검수해요. ④ 검수 요청문을 Claude 채팅에 보내고, 답변을 아래에 붙여 넣은 뒤 ⑤를 누르세요. 복수 정답, 정답 표시, 해설이 맞는지 확인하고 틀린 곳은 고쳐 줘요.<\/p>\n          <div id=\"review-prompts\" class=\"prompts\"><\/div>\n          <label class=\"field\" for=\"review-in\">Claude의 검수 답변 붙여넣기\n            <textarea id=\"review-in\" class=\"mono\" rows=\"4\" placeholder='{\"reviews\":[ ... ]}'><\/textarea>\n          <\/label>\n          <div class=\"row\"><button type=\"button\" class=\"primary\" id=\"load-review\">⑤ 검수 결과 불러오기<\/button><\/div>\n        <\/div>\n      <\/section>\n    <\/div>\n\n    <section class=\"stack\" aria-labelledby=\"h-sheet\">\n      <div class=\"panel\">\n        <div class=\"sheet-bar\">\n          <h2 id=\"h-sheet\">문제지 <span class=\"hint\" id=\"count\">0문제<\/span><\/h2>\n          <div class=\"row\">\n            <button type=\"button\" id=\"save-hwpx\" class=\"primary\">한글 파일 저장<\/button>\n            <button type=\"button\" id=\"save-pdf\">PDF 저장<\/button>\n            <button type=\"button\" id=\"rebalance\" title=\"객관식 정답이 ①~⑤에 고르게 나오도록 선지 순서를 다시 맞춰요\">정답 번호 고르게<\/button>\n            <button type=\"button\" id=\"clear\">모두 지우기<\/button>\n          <\/div>\n        <\/div>\n        <p class=\"hint\" id=\"save-hint\"><\/p>\n        <p class=\"hint\">‘회차별로 나누기’를 켜면 1회차에 고른 지문 전부가 모든 유형으로 한 번씩 실리고, 2회차는 새 쪽에서 같은 방식으로 한 번 더 실려요. 개수를 2로 하면 2회차까지 생겨요.<\/p>\n        <div id=\"save-status\" class=\"msg\" hidden><\/div>\n        <div id=\"confirm-clear\" class=\"msg warn\" hidden>\n          문제를 모두 지울까요? 지문 보관함은 그대로 남아요.\n          <button type=\"button\" id=\"clear-yes\">지우기<\/button>\n          <button type=\"button\" id=\"clear-no\">취소<\/button>\n        <\/div>\n\n        <details id=\"layout-box\">\n          <summary>문제지 꾸미기 (제목·머리말·꼬리말)<\/summary>\n          <div class=\"sub grid2\">\n            <label class=\"field\" for=\"title\">제목\n              <input type=\"text\" id=\"title\" value=\"영어 변형문제\">\n            <\/label>\n            <label class=\"field\" for=\"eyebrow\">제목 위 작은 글\n              <input type=\"text\" id=\"eyebrow\" placeholder=\"예: ENGLISH · 변형문제\">\n            <\/label>\n            <label class=\"field\" for=\"header-left\">머리말 왼쪽\n              <input type=\"text\" id=\"header-left\" placeholder=\"예: 행복영어학원\">\n            <\/label>\n            <label class=\"field\" for=\"header-right\">머리말 오른쪽\n              <input type=\"text\" id=\"header-right\" placeholder=\"예: 고2 영어\">\n            <\/label>\n            <label class=\"field\" for=\"footer-left\">꼬리말 왼쪽\n              <input type=\"text\" id=\"footer-left\" placeholder=\"예: 김OO 선생님\">\n            <\/label>\n            <label class=\"field\" for=\"footer-right\">꼬리말 오른쪽\n              <input type=\"text\" id=\"footer-right\" placeholder=\"예: cafe.naver.com/…\">\n            <\/label>\n          <\/div>\n          <p class=\"hint\">쪽 번호는 꼬리말 가운데에 자동으로 들어가요.<\/p>\n        <\/details>\n        <div class=\"row\">\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-name\" checked> 반·번호·이름 칸<\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-cols\" checked> 2단 편집<\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-answers\" checked> 정답지 붙이기<\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-expl\" checked> 해설 넣기<\/label>\n          <label class=\"check\"><input type=\"checkbox\" id=\"opt-rounds\" checked> 회차별로 나누기<\/label>\n          <label class=\"check\" for=\"opt-typemark\">유형 표시\n            <select id=\"opt-typemark\" class=\"inline-select\">\n              <option value=\"tag\">발문 끝 꼬리표<\/option>\n              <option value=\"section\">유형 구간 제목<\/option>\n              <option value=\"both\">둘 다<\/option>\n              <option value=\"none\">표시 안 함<\/option>\n            <\/select>\n          <\/label>\n        <\/div>\n      <\/div>\n      <div class=\"pages-scroll\" id=\"pages-scroll\"><div class=\"pages\" id=\"pages\"><\/div><\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\n ader\": 29, \"footer\": 30, \"ansTitle\": 31, \"gridCell\": 32, \"gridCaption\": 33, \"typeHead\": 34, \"ans\": 35, \"answerLine\": 36}, \"borderFill\": {\"box\": 3, \"headRule\": 4, \"footRule\": 5, \"headerRule\": 6, \"typeRule\": 7, \"gridNum\": 8, \"gridAns\": 9}}};\nif (typeof module !== \"undefined\") module.exports = HWPX_TEMPLATE;\n<\/script>\n<script>\n// 변형문제 메이커 핵심 로직 (화면과 무관한 부분).\n// 브라우저에서는 전역 VM으로, Node 테스트에서는 require로 쓴다.\n(function (root) {\n  \"use strict\";\n\n  var CIRCLED = [\"①\", \"②\", \"③\", \"④\", \"⑤\"];\n\n  // 문제지에 실리는 유형 순서\n  var TYPES = [\n    { key: \"claim\", name: \"주장\", mode: \"ai\", instruction: \"다음 글에서 필자가 주장하는 바로 가장 적절한 것은?\" },\n    { key: \"gist\", name: \"요지\", mode: \"ai\", instruction: \"다음 글의 요지로 가장 적절한 것은?\" },\n    { key: \"topic\", name: \"주제\", mode: \"ai\", instruction: \"다음 글의 주제로 가장 적절한 것은?\" },\n    { key: \"title\", name: \"제목\", mode: \"ai\", instruction: \"다음 글의 제목으로 가장 적절한 것은?\" },\n    { key: \"implied\", name: \"함축적 의미\", mode: \"ai\", instruction: \"밑줄 친 부분이 다음 글에서 의미하는 바로 가장 적절한 것은?\" },\n    { key: \"grammar\", name: \"어법\", mode: \"ai\", instruction: \"다음 글의 밑줄 친 부분 중, 어법상 틀린 것은?\" },\n    { key: \"vocab\", name: \"어휘\", mode: \"ai\", instruction: \"다음 글의 밑줄 친 부분 중, 문맥상 낱말의 쓰임이 적절하지 않은 것은?\" },\n    { key: \"blank\", name: \"빈칸\", mode: \"ai\", instruction: \"다음 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.\" },\n    { key: \"order\", name: \"순서\", mode: \"auto\", instruction: \"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것을 고르시오.\" },\n    { key: \"insert\", name: \"문장삽입\", mode: \"auto\", instruction: \"글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳을 고르시오.\" },\n    { key: \"summary\", name: \"요약\", mode: \"ai\", instruction: \"다음 글의 내용을 한 문장으로 요약하고자 한다. 빈칸 (A), (B)에 들어갈 말로 가장 적절한 것은?\" },\n    { key: \"summaryWrite\", name: \"요약 서술형\", mode: \"ai\", instruction: \"다음 글의 내용을 요약했을 때, 빈칸 (A)~(C)에 들어갈 가장 적절한 단어를 본문에서 각각 한 단어씩 찾아 그대로 쓰시오.\" },\n    { key: \"fix\", name: \"어법 오류 고치기\", mode: \"ai\", instruction: \"위 글의 밑줄 친 (A)~(E) 중 어법상 틀린 부분이 있는 것을  문두 도치의 어순, 장소·방향 부사구 도치, so/neither 도치, 도치 구문 안의 주어-동사 수일치\",\n    \"  10. 그 밖의 고난도: 멀리 떨어진 병렬 구조, 대명사 수일치(it/they, that/those), 재귀대명사, 2형식 보어 자리의 형용사 vs 부사, 접속사 vs 전치사(although/despite, because/because of), 자동사의 수동태 불가, 수동태 뒤 목적어\",\n    \"- 쓰지 말 것(너무 쉬운 포인트): 조동사 뒤 동사원형(will being, can goes 같은 것), 명백한 철자 오류, 주어 바로 뒤 동사의 단순 수일치, 누구나 아는 불규칙 동사 형태, 관사 하나 바꾸기, 뜻이 통하지 않을 만큼 엉뚱한 단어.\",\n    \"- 틀린 곳은 그럴듯한 함정이어야 한다: 바로 앞 단어만 보면 맞아 보이지만 문장 구조를 분석해야 틀렸음을 알 수 있게 만든다.\",\n    \"- 옳은 밑줄도 학생이 헷갈릴 만한 고난도 포인트로 고른다(뻔히 옳아 보이는 곳 X).\",\n    \"- 지문에 해당 구조가 없으면 의미를 바꾸지 않는 범위에서 그 구조가 드러나도록 표현을 조금 바꿔도 된다(어법 오류 고치기에서는 밑줄 문장 안에서만).\",\n    \"- 목표 수준 예시(이 정도의 난이도와 해설을 기준으로 삼는다):\",\n    \"  · research on how artists develop their skills ①suggests that … → 옳음. 주어 research와 동사 사이 전치사구 때문에 복수 skills에 속기 쉬운 멀리 떨어진 수일치\",\n    \"  · our brains form connections ③where did not exist before → 틀림(that/which). 뒤 절에 주어가 없는 불완전한 절이므로 관계부사가 아니라 주격 관계대명사\",\n    \"  · the habit makes it ④easier to let quantity lead to quality → 옳음. 가목적어 it + 형용사 목적격보어 + 진목적어\",\n    \"  · Rarely ⑤do such surprises appear … → 옳음. 부정어 문두 도치와 복수 주어 수일치\",\n    \"  · a designer … soon finds what unusual solutions come more easily → 틀림(that). 뒤 절이 완전하므로 명사절 접속사 that\",\n    \"  · Such surprises rarely appear …, emerging instead in the middle of steady effort → 옳음. 자동사 emerge의 능동 분사구문(emerged로 바꾸면 함정)\"\n  ].join(\"\\n\");\n\n  // avoidNotes: 같은 지문·같은 유형으로 이미 만든 문제 요약(avoidNote). 이것들과 겹치지 않게 만들게 한다.\n  function buildPrompt(passage, typeKey, count, targets, avoidNotes) {\n    var t = TYPE_BY_KEY[typeKey];\n    if (!t || t.mode !== \"ai\") throw new Error(\"AI 유형이 아닙니다: \" + typeKey);\n    return [\n      \"당신은 한국 고등학교 영어 교사로, 수능·모의고사 형식의 영어 변형문제를 만듭니다.\",\n      \"아래 지문으로 [\" + t.name + \"] 유형 문제를 \" + count + \"개 만드세요.\",\n      \"\",\n      \"## 유형 설명\",\n      AI_SPECS[typeKey],\n      GRAMMAR_TYPES[typeKey] ? \"\\n\" + GRAMMAR_GUIDE : \"\",\n      \"\",\n      \"## 공통 규칙\",\n      \"- 기본 발문: \" + t.instruction,\n      targets && targets.length ? \"- 정답 번호는 문제 순서대로 \" + targets.map(function (x) { return CIRCLED[x]; }).join(\", \") + \"가 되게 만드세요.\" : \"\",\n      \"- 여러 문제를 만들 때는 문제마다 선지·밑줄 위치·정답 번호가 서로 달라야 합니다.\",\n      \"- 정답은 반드시 하나뿐이어야 합니다. 출력 전에 오답 선지가 지문 내용상 정답이 될 여지가 없는지, 선지끼리 같은 뜻이 아닌지, 표시한 정답과 해설이 맞는지 스스로 다시 확인하세요.\",\n      \"- 객관식 정답은 ①~⑤ 중 하나로 쓰고, 여러 문제의 정답 번호가 한쪽으로 몰리지 않게 합니다.\",\n      \"- 밑줄은 <u>…<\/u>, 굵은 글씨는 <b>…<\/b> 태그만 씁니다. 다른 태그나 마크다운은 쓰지 않습니다.\",\n      \"- 문단을 나눌 때는 \\\\n 을 씁니다.\",\n      GRAMMAR_TYPES[typeKey] ? \"- explanation은 한국어로, 출제 포인트와 이유가 드러나게 3~5문장으로 씁니다.\" : \"- explanation은 한국어 1~2문장으로 씁니다.\",\n      \"\",\n      avoidNotes && avoidNotes.length ? \"\\n## 이미 만든 문제 (이번 문제는 이것들과 밑줄 위치·빈칸·정답 선지·출제 포인트가 겹치지 않게 새로 만드세요)\\n\" + avoidNotes.map(function (a) { return \"- \" + a; }).join(\"\\n\") + \"\\n\" : \"\",\n      \"## 출력 형식\",\n      \"설명 없이 JSON만 출력합니다.\",\n      '{\"problems\":[{\"instruction\":\"발문\",\"box\":\"상자에 넣을 글 또는 null\",\"boxFirst\":true,\"passage\":\"지문\",\"choices\":[\"…\",\"…\",\"…\",\"…\",\"…\"] 또는 null,\"answer\":\"③\",\"explanation\":\"해설\"}]}',\n      \"\",\n      \"## 지문\",\n      normalizeText(passage).trim()\n    ].join(\"\\n\");\n  }\n\n  // 여러 지문과 여러 유형을 한 번에 요청하는 요청문 (Claude 채팅에 붙여 넣는 용도)\n  // plan: {유형: {지문 번호: [정답 번호(0~4)…]}} — 어법·어휘의 정답 번호 지정\n  function buildCombinedPrompt(passages, requests, plan) {\n    var parts = requests.map(function (r) {\n      var t = TYPE_BY_KEY[r.type];\n      return \"### \" + t.name + \" (지문마다 \" + r.count + \"문제, type 값: \\\"\" + r.type + \"\\\")\\n- 기본 발문: \" + t.instruction + \"\\n- \" + AI_SPECS[r.type];\n    });\n    var texts = passages.map(function (p, i) {\n      var id = p.no || String(i + 1);\n      return \"### 지문 [\" + id + \"]\\n\" + normalizeText(p.text).trim();\n    });\n    return [\n      \"당신은 한국 고등학교 영어 교사로, 수능·모의고사 형식의 영어 변형문제를 만듭니다.\",\n      \"아래 \" + passages.length + \"개 지문 각각으로 다음 유형의 문제를 만드세요.\",\n      \"\",\n      parts.join(\"\\n\\n\"),\n      requests.some(function (r) { return GRAMMAR_TYPES[r.type]; }) ? \"\\n\" + GRAMMAR_GUIDE : \"\",\n      \"\",\n      \"## 공통 규칙\",\n      \"- 같은 유형의 문제끼리는 선지·밑줄 위치·정답 번호가 서로 달라야 합니다.\",\n      \"- 정답은 반드시 하나뿐이어야 합니다. 출력 전에 오답 선지가 지문 내용상 정답이 될 여지가 없는지, 선지끼리 같은 뜻이 아닌지, 표시한 정답과 해설이 맞는지 스스로 다시 확인하세요.\",\n      \"- 객관식 정답은 ①~⑤ 중 하나로 쓰고, 정답 번호가 한쪽으로 몰리지 않게 합니다.\",\n      \"- 밑줄은 <u>…<\/u>, 굵은 글씨는 <b>…<\/b> 태그만 씁니다. 다른 태그나 마크다운은 쓰지 않습니다.\",\n      \"- 문단을 나눌 때는 \\\\n 을 씁니다. explanation은 한국어 1~2문장(어법·어법 오류 고치기는 출제 포인트가 드러나게 3~5문장).\",\n      planLines(passages, requests, plan),\n      \"\",\n      \"## 출력 형식\",\n      \"설명 없이 JSON만 출력합니다. 각 문제에 type 값과, 어느 지문으로 만들었는지 src 값(지문 [ ] 안의 번호)을 반드시 넣습니다.\",\n      '{\"problems\":[{\"src\":\"' + (passages[0].no || \"1\") + '\",\"type\":\"topic\",\"instruction\":\"발문\",\"box\":null,\"boxFirst\":true,\"passage\":\"지문\",\"choices\":[\"…\",\"…\",\"…\",\"…\",\"…\"],\"answer\":\"③\",\"explanation\":\"해설\"}]}',\n      \"\",\n      \"## 지문\",\n      texts.join(\"\\n\\n\")\n    ].join(\"\\n\");\n  }\n\n  function planLines(passages, requests, plan) {\n    if (!plan) return \"\";\n    var lines = [];\n    var avoid = plan.__avoid || {};\n    passages.forEach(function (p, i) {\n      var id = p.no || String(i + 1);\n      requests.forEach(function (r) {\n        var notes = avoid[r.type] && avoid[r.type][id];\n        if (notes && notes.length) lines.push(\"- 지문 [\" + id + \"] \" + TYPE_BY_KEY[r.type].name + \"는 이미 만든 문제와 겹치지 않게 (\" + notes.join(\" / \") + \")\");\n      });\n    });\n    requests.forEach(function (r) {\n      if (!plan[r.type]) return;\n      passages.forEach(function (p, i) {\n        var id = p.no || String(i + 1);\n        var want = plan[r.type][id];\n        if (want && want.length) lines.push(\"- 지문 [\" + id + \"] \" + TYPE_BY_KEY[r.type].name + \": 정답 번호를 문제 순서대로 \" + want.map(function (x) { return CIRCLED[x]; }).join(\", \") + \"로 만드세요.\");\n      });\n    });\n    return lines.length ? \"- 아래 내용을 지켜 주세요.\\n\" + lines.join(\"\\n\") : \"\";\n  }\n\n  // ---------- 지문 여러 개 한꺼번에 등록 ----------\n\n  // 번호 줄: \"[18]\", \"[41-42]\", \"[3강 1번]\", \"18번\"\n  var PASSAGE_MARK = /^\\s*(?:\\[\\s*([^\\]\\n]{1,20}?)\\s*\\]|(\\d{1,3}(?:\\s*[-~]\\s*\\d{1,3})?)\\s*번)\\s*[.:)]?\\s*$/;\n  var NUMERIC_NO = /^\\d+(?:-\\d+)?$/;\n\n  // \"41 ~ 42번\" → \"41-42\", \"3강  1번\" → \"3강 1번\"\n  function normalizeNo(no) {\n    var s = String(no == null ? \"\" : no).trim().replace(/\\s+/g, \" \").replace(/\\s*[-~]\\s*/g, \"-\");\n    var m = s.match(/^(\\d+(?:-\\d+)?)\\s*번$/);\n    return m ? m[1] : s;\n  }\n\n  // 화면과 문제지에 쓰는 지문 번호: 숫자면 \"29번\", 아니면 그대로\n  function noLabel(no) {\n    return NUMERIC_NO.test(no) ? no + \"번\" : String(no || \"\");\n  }\n\n  // \"[18]\" 또는 \"18번\" 줄로 시작하는 지문들을 나눈다.\n  function parseBulkPassages(text) {\n    var out = [], current = null;\n    normalizeText(text).split(\"\\n\").forEach(function (line) {\n      var m = line.match(PASSAGE_MARK);\n      if (m) {\n        current = { no: normalizeNo(m[1] || m[2]), lines: [] };\n        out.push(current);\n      } else if (current) {\n        current.lines.push(line);\n      }\n    });\n    return out.map(function (p) { return { no: p.no, text: p.lines.join(\"\\n\").trim() }; })\n      .filter(function (p) { return p.text; });\n  }\n\n  // ---------- AI 답변 읽기 ----------\n\n  // 글 속에 들어 있는 JSON 값들을 모두 꺼낸다. 답변 여러 개를 이어 붙여도 읽을 수 있다.\n  function extractJsonAll(text) {\n    if (text && typeof text === \"object\") return [text];\n    var s = String(text || \"\").replace(/```(?:json)?/g, \"\");\n    var found = [];\n    for (var i = 0; i < s.length; i++) {\n      if (s[i] !== \"{\") continue;\n      var depth = 0, inStr = false, esc = false, j = i;\n      for (; j < s.length; j++) {\n        var c = s[j];\n        if (inStr) {\n          if (esc) esc = false;\n          else if (c === \"\\\\\") esc = true;\n          else if (c === \"\\\"\") inStr = false;\n        } else if (c === \"\\\"\") inStr = true;\n        else if (c === \"{\") depth++;\n        else if (c === \"}\") { depth--; if (depth === 0) break; }\n      }\n      if (depth !== 0) break;\n      try { found.push(JSON.parse(s.slice(i, j + 1))); i = j; } catch (e) { /* 다음 { 부터 다시 */ }\n    }\n    if (!found.length) throw new Error(\"AI 답변에서 JSON을 찾지 못했습니다. 답변 전체를 그대로 붙여 넣었는지 확인하세요.\");\n    return found;\n  }\n\n  function normalizeAnswer(ans) {\n    var s = String(ans == null ? \"\" : ans).trim();\n    if (/^[1-5]$/.test(s)) return CIRCLED[Number(s) - 1];\n    return s;\n  }\n\n  // AI 답변을 문제 목록으로 바꾼다.\n  // ctx: {type: 기본 유형, exam: 시험 이름, no: 기본 지문 번호}\n  function parseAiProblems(text, ctx) {\n    if (typeof ctx === \"string\" || ctx == null) ctx = { type: ctx };\n    var list = [];\n    extractJsonAll(text).forEach(function (data) {\n      var items = Array.isArray(data) ? data : data.problems;\n      if (Array.isArray(items)) list = list.concat(items);\n    });\n    if (!list.length) throw new Error(\"AI 답변에 problems 목록이 없습니다.\");\n    var warnings = [];\n    var problems = list.map(function (p, i) {\n      var type = TYPE_BY_KEY[p.type] ? p.type : ctx.type;\n      if (!TYPE_BY_KEY[type]) throw new Error((i + 1) + \"번째 문제의 유형(type)을 알 수 없습니다.\");\n      var choices = Array.isArray(p.choices) && p.choices.length ? p.choices.map(String) : null;\n      var label = TYPE_BY_KEY[type].name + \" \" + (i + 1) + \"번째 문제\";\n      if (choices && choices.length !== 5) warnings.push(label + \": 선지가 \" + choices.length + \"개입니다.\");\n      if (!p.answer) warnings.push(label + \": 정답이 비어 있습니다.\");\n      if (!p.passage) warnings.push(label + \": 지문이 비어 있습니다.\");\n      var no = normalizeNo(p.src != null ? p.src : ctx.no);\n      return {\n        type: type,\n        instruction: p.instruction ? String(p.instruction) : TYPE_BY_KEY[type].instruction,\n        box: p.box ? String(p.box) : null,\n        boxFirst: p.boxFirst !== false,\n        passage: String(p.passage || \"\"),\n        choices: choices,\n        answer: normalizeAnswer(p.answer),\n        explanation: p.explanation ? String(p.explanation) : \"\",\n        source: no ? { exam: ctx.exam || \"\", no: no } : null\n      };\n    });\n    return { problems: problems, warnings: warnings };\n  }\n\n  // ---------- 검수 ----------\n\n  // AI가 만든 유형(자동 유형은 원문에서 바로 만들어 검수할 필요가 없다)\n  function needsReview(p) {\n    return TYPE_BY_KEY[p.type] && TYPE_BY_KEY[p.type].mode === \"ai\";\n  }\n\n  function plainText(s) { return String(s || \"\").replace(/<\\/?[ub]>/gi, \"\").replace(/\\s+/g, \" \").trim(); }\n\n  // 프로그램이 직접 하는 형식 검사. 문제마다 고칠 점 목록을 돌려준다.\n  // original: 원문(있으면 지문이 빠짐없이 실렸는지도 본다)\n  function checkProblem(p, original) {\n    var issues = [];\n    var mcTypes = { claim: 1, gist: 1, topic: 1, title: 1, implied: 1, blank: 1, summary: 1, order: 1 };\n    var ans = CIRCLED.indexOf(p.answer);\n    if (mcTypes[p.type]) {\n      if (!p.choices || p.choices.length !== 5) issues.push(\"선지가 5개가 아니에요\");\n      else {\n        var seen = {};\n        p.choices.forEach(function (c, i) {\n          var k = plainText(c).toLowerCase().replace(/[.!?]$/, \"\");\n          if (seen[k] !== undefined) issues.push(CIRCLED[seen[k]] + \"와 \" + CIRCLED[i] + \" 선지가 같아요\");\n          seen[k] = i;\n          if (!k) issues.push(CIRCLED[i] + \" 선지가 비어 있어요\");\n        });\n      }\n      if (ans < 0) issues.push(\"정답이 ①~⑤ 중 하나가 아니에요\");\n    }\n    if (p.type === \"grammar\" || p.type === \"vocab\") {\n      var marks = (String(p.passage).match(/<u>\\s*[①-⑤]/g) || []).map(function (m) { return m.replace(/<u>\\s*/, \"\"); });\n      var uniq = marks.filter(function (m, i) { return marks.indexOf(m) === i; });\n      if (uniq.length !== 5) issues.push(\"밑줄 번호(①~⑤)가 \" + uniq.length + \"개예요\");\n      if (ans < 0) issues.push(\"정답이 ①~⑤ 중 하나가 아니에요\");\n      else if (uniq.length && uniq.indexOf(p.answer) < 0) issues.push(\"정답 \" + p.answer + \"가 지문의 밑줄 번호에 없어요\");\n    }\n    if (p.type === \"insert\") {\n      var m2 = (String(p.passage).match(/\\( [①-⑤] \\)/g) || []).length;\n      if (m2 < 3) issues.push(\"자리 표시가 \" + m2 + \"개뿐이에요\");\n    }\n    if (WRITE_TYPES[p.type] && !plainText(p.answer)) issues.push(\"모범 답안이 비어 있어요\");\n    issues = issues.concat(trivialGrammar(p));\n    if (p.type === \"summaryWrite\") {\n      var words = parseLetteredAnswer(p.answer, [\"A\", \"B\", \"C\"]);\n      var body = \" \" + plainText(p.passage).toLowerCase().replace(/[^a-z'\\-]+/g, \" \") + \" \";\n      [\"A\", \"B\", \"C\"].forEach(function (L) {\n        var w = (words[L] || \"\").toLowerCase();\n        if (!w) issues.push(\"(\" + L + \") 정답이 없어요\");\n        else if (/\\s/.test(w)) issues.push(\"(\" + L + \") 정답이 한 단어가 아니에요\");\n        else if (body.indexOf(\" \" + w + \" \") < 0) issues.push(\"(\" + L + \") 정답 '\" + w + \"'가 본문에 없어요\");\n      });\n      if ((String(p.box || \"\").match(/\\([ABC]\\)/g) || []).length < 3) issues.push(\"요약문에 빈칸 (A)~(C)가 모두 있지 않아요\");\n    }\n    if (p.type === \"fix\") {\n      var spans = {}, rawSpans = {};\n      (String(p.passage).match(/<u>\\s*\\(([A-E])\\)([^]*?)<\\/u>/g) || []).forEach(function (u) {\n        var m = u.match(/<u>\\s*\\(([A-E])\\)([^]*?)<\\/u>/);\n        rawSpans[m[1]] = plainText(m[2]);\n        spans[m[1]] = rawSpans[m[1]].toLowerCase();\n      });\n      if (Object.keys(spans).length !== 5) issues.push(\"밑줄 기호 (A)~(E)가 \" + Object.keys(spans).length + \"개예요\");\n      // 한 문장 전체: 대문자(또는 따옴표·숫자)로 시작해 마침표·물음표·느낌표로 끝나야 한다.\n      var partial = Object.keys(rawSpans).filter(function (L) { return !/^[\"'(]?[A-Z0-9]/.test(rawSpans[L]) || !/[.!?][\"')]?$/.test(rawSpans[L]); });\n      if (partial.length) issues.push(\"(\" + partial.join(\"), (\") + \")가 문장 전체에 밑줄이 그어지지 않았어요\");\n      if (original) {\n        var countWords = function (t) { return plainText(t).replace(/\\(([A-E])\\)/g, \" \").split(/\\s+/).filter(Boolean).length; };\n        var have = countWords(p.passage), want = countWords(original);\n        if (want && have < want * 0.9) issues.push(\"지문이 원문보다 짧아요 (원문 \" + want + \"단어, 지문 \" + have + \"단어)\");\n      }\n      var fixes = String(p.answer || \"\").match(/\\(([A-E])\\)\\s*([^\\s,→\\-]+)\\s*(?:→|->|-)\\s*([^\\s,/]+)/g) || [];\n      if (fixes.length !== 2) issues.push(\"고친 곳이 2개가 아니에요 (\" + fixes.length + \"개)\");\n      fixes.forEach(function (f) {\n        var m = f.match(/\\(([A-E])\\)\\s*([^\\s,→\\-]+)\\s*(?:→|->|-)\\s*([^\\s,/]+)/);\n        var span = spans[m[1]];\n        if (span !== undefined && (\" \" + span.replace(/[^a-z'\\-]+/g, \" \") + \" \").indexOf(\" \" + m[2].toLowerCase() + \" \") < 0) issues.push(\"(\" + m[1] + \")의 틀린 부분 '\" + m[2] + \"'가 밑줄 안에 없어요\");\n      });\n    }\n    if (!plainText(p.passage)) issues.push(\"지문이 비어 있어요\");\n    return issues;\n  }\n\n  // 너무 쉬운 어법 포인트: 틀린 단어 바로 앞이 조동사인 경우(will being, can goes 같은 것)\n  var MODALS = /\\b(?:will|would|can|could|shall|should|may|might|must)\\s+(?:not\\s+)?$/i;\n  function trivialGrammar(p) {\n    var hits = [];\n    if (p.type === \"grammar\") {\n      var m = String(p.passage || \"\").match(new RegExp(\"([^<>]{0,40})<u>\\\\s*\" + p.answer + \"\\\\s*([^<]*)<\/u>\"));\n      if (m && MODALS.test(plainText(m[1]) + \" \")) hits.push(\"정답 \" + p.answer + \"가 조동사 바로 뒤 동사 형태예요. 너무 쉬운 포인트예요\");\n    }\n    if (p.type === \"fix\") {\n      var rx = /\\(([A-E])\\)\\s*([^\\s,→\\-]+)\\s*(?:→|->|-)\\s*([^\\s,/]+)/g, f;\n      var text = plainText(p.passage);\n      while ((f = rx.exec(String(p.answer || \"\"))) !== null) {\n        var idx = text.indexOf(\" \" + f[2] + \" \");\n        if (idx < 0) idx = text.indexOf(\" \" + f[2]);\n        if (idx >= 0 && MODALS.test(text.slice(Math.max(0, idx - 30), idx + 1))) hits.push(\"(\" + f[1] + \") '\" + f[2] + \"'는 조동사 바로 뒤 동사 형태예요. 너무 쉬운 포인트예요\");\n      }\n    }\n    return hits;\n  }\n\n  // \"(A) word (B) word (C) word\" → {A: \"word\", ...}\n  function parseLetteredAnswer(text, letters) {\n    var out = {};\n    var s2 = plainText(text);\n    letters.forEach(function (L, i) {\n      var next = letters[i + 1];\n      var re = new RegExp(\"\\\\(\" + L + \"\\ 몇 번째로 만든 문제인가.\n  // 기본: 유형 → 회차 → 지문 순서. 즉 유형 안에서 지문들이 1회차, 2회차… 로 번갈아 나온다.\n  // roundsFirst: 회차 → 유형 → 지문 순서. 1회차 시험지 전체, 2회차 시험지 전체로 나뉜다.\n  // passageRank(source)는 지문의 순서 번호를 돌려준다. 같으면 원래 순서를 지킨다.\n  function sortProblems(problems, passageRank, roundsFirst) {\n    var seen = {};\n    function typeRank(p) { return TYPE_BY_KEY[p.type] ? TYPE_BY_KEY[p.type].order : TYPES.length; }\n    function srcRank(p) {\n      var r = p.source && passageRank ? passageRank(p.source) : null;\n      return r == null ? Infinity : r;\n    }\n    function cmp(a, b) { return a === b ? 0 : a < b ? -1 : 1; }\n    return problems.map(function (p, i) {\n      var key = p.type + \"\\u0001\" + (p.source ? (p.source.exam || \"\") + \"\\u0001\" + p.source.no : \"#\" + i);\n      var r = seen[key] || 0;\n      seen[key] = r + 1;\n      p.round = r;\n      return { p: p, i: i, t: typeRank(p), s: srcRank(p), r: r };\n    }).sort(function (a, b) {\n      return (roundsFirst ? a.r - b.r || a.t - b.t : a.t - b.t || a.r - b.r) || cmp(a.s, b.s) || a.i - b.i;\n    }).map(function (x) { return x.p; });\n  }\n\n  // ---------- 정답 번호 고르게 ----------\n\n  // 이 문제의 정답을 옮길 수 있는 번호(0~4) 목록. 옮길 수 없으면 빈 목록.\n  // - 선지가 5개인 객관식: 선지 순서를 바꿔 어느 번호로든 옮긴다.\n  // - 순서: (A)(B)(C) 이름표를 바꿔 어느 번호로든 옮긴다.\n  // - 문장삽입: 자리 표시 ①~⑤의 시작 위치를 옮길 수 있는 만큼.\n  // - 어법·어휘처럼 지문 속에 번호가 박힌 문제와 서술형은 옮기지 않는다.\n  function answerOptions(p) {\n    var cur = CIRCLED.indexOf(p.answer);\n    if (cur < 0) return [];\n    if (p.type === \"order\") return /^\\(A\\) /m.test(p.passage || \"\") ? range(5) : [];\n    if (p.type === \"insert\") {\n      var m = p.meta;\n      if (!m || !m.remaining) return [];\n      var slots = m.remaining.length;\n      return range(m.markers).filter(function (t) {\n        var start = m.removed - t;\n        return start >= Math.max(1, m.removed - m.markers + 1) && start <= Math.min(m.removed, slots - m.markers + 1);\n      });\n    }\n    if (p.choices && p.choices.length === 5 && (p.type !== \"grammar\" && p.type ];\n    problems.forEach(function (p) { var a = CIRCLED.indexOf(p.answer); if (a >= 0) c[a]++; });\n    return c;\n  }\n\n  // ---------- 서식 문자열 (<u>, <b>) ----------\n\n  // \"a <u>b<\/u> <b>c<\/b>\" → [{text, u, b}, ...]. 다른 태그는 글자 그대로 둔다.\n  function parseRuns(str) {\n    var runs = [];\n    var u = 0, b = 0;\n    var re = /<(\\/?)([ub])>/gi;\n    var last = 0, m;\n    str = String(str || \"\");\n    function push(text) {\n      if (!text) return;\n      var prev = runs[runs.length - 1];\n      if (prev && prev.u === (u > 0) && prev.b === (b > 0)) prev.text += text;\n      else runs.push({ text: text, u: u > 0, b: b > 0 });\n    }\n    while ((m = re.exec(str)) !== null) {\n      push(str.slice(last, m.index));\n      var d = m[1] ? -1 : 1;\n      if (m[2].toLowerCase() === \"u\") u = Math.max(0, u + d); else b = Math.max(0, b + d);\n      last = m.index + m[0].length;\n    }\n    push(str.slice(last));\n    return runs;\n  }\n\n  // ---------- 문서 구성 ----------\n\n  // 원문 번호 표시. 문제지에 여러 시험의 지문이 섞여 있으면 시험 이름도 붙인다.\n  function sourceLabels(problems) {\n    var exams = {};\n    problems.forEach(function (p) { if (p.source && p.source.no) exams[p.source.exam || \"\"] = true; });\n    var mixed = Object.keys(exams).length > 1;\n    return problems.map(function (p) {\n      if (!p.source || !p.source.no) return \"\";\n      return (mixed && p.source.exam ? p.source.exam + \" · \" : \"\") + noLabel(p.source.no);\n    });\n  }\n\n  var WRITE_TYPES = { arrange: true, compose: true, fix: true, summaryWrite: true };\n  var FIX_CONDITIONS = [\n    \"<조건>\",\n    \"1. 어법상 틀린 부분을 포함하고 있는 것의 알파벳 (A)~(E)과 어법상 틀린 부분(1단어)을 쓰고, 어법에 맞게 고쳐 쓸 것(1단어).\",\n    \"2. 아래 주어진 표대로 작성할 것.\"\n  ];\n  var FIX_TABLE_HEADER = [\"알파벳\", \"어법상 틀린 부분 (1단어)\", \"어법상 맞는 형태 (1단어)\"];\n  var BOLD_UNDERLINE_TYPES = { grammar: true, vocab: true, fix: true };\n  var GRID_PER_ROW = 10; // 정답표 한 줄에 놓는 (번호, 정답) 쌍 수\n\n  // 문제지를 서식 블록 목록으로 바꾼다. 화면 미리보기·PDF·HWPX·DOCX가 모두 같은 블록을 쓴다.\n  // 블록: {kind, runs, first? , review: true }\n  };\n  var lib = { exams: [], currentExam: null };\n  var editing = null;        // 편집 중인 지문 id (null이면 새 지문)\n  var checked = {};          // 문제를 만들 지문 id\n  var examForm = null;       // \"new\" | \"rename\"\n  var pendingCtx = null;     // 수동 AI 붙여넣기를 기다리는 {exam, passages}\n  var sampleFn = null, downloadsCap = null, aborter = null;\n  var lastTarget = null;     // 마지막으로 만든 {passages, types}: 빠진 문제 점검용\n\n  if (window.claude && typeof window.claude.use === \"function\") {\n    window.claude.use(\"sample\").then(function (s) { sampleFn = s; updateManualIntro(); if (s) { renderReviewPrompts(); renderCoverage(); } }).catch(function () {});\n    window.claude.use(\"downloads\").then(function (d) { downloadsCap = d; updateSaveHint(); }).catch(function () {});\n  }\n\n  // ---------- 저장 ----------\n\n  function loadJson(key) {\n    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }\n  }\n  function saveJson(key, value) {\n    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 저장 공간을 못 쓰는 환경 */ }\n  }\n  function saveState() {\n    saveJson(STATE_KEY, { problems: state.problems, selection: state.selection, layout: state.layout, options: state.options, checked: checked, byLine: $(\"by-line\").checked });\n  }\n  function saveLib() { saveJson(LIB_KEY, lib); }\n\n  // ---------- 알림 ----------\n\n  function show(el, kind, text) {\n    el.hidden = !text;\n    el.className = \"msg \" + (kind || \"\");\n    el.textContent = text || \"\";\n  }\n\n  // ---------- 지문 보관함 ----------\n\n  function currentExam() {\n    return lib.exams.filter(function (e) { return e.id === lib.currentExam; })[0] || null;\n  }\n\n  function sortPassages(list) {\n    return list.slice().sort(function (a, b) {\n      var na = parseInt(a.no, 10), nb = parseInt(b.no, 10);\n      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;\n      return String(a.no).localeCompare(String(b.no));\n    });\n  }\n\n  function renderExams() {\n    var sel = $(\"exam\");\n    sel.textContent = \"\";\n    lib.exams.forEach(function (e) {\n      var o = document.createElement(\"option\");\n      o.value = e.id; o.textContent = e.name + \" (\" + e.passages.length + \")\";\n      sel.appendChild(o);\n    });\n    if (!lib.exams.length) {\n      var o = document.createElement(\"option\");\n      o.value = \"\"; o.textContent = \"교재가 없어요. ‘새 교재’를 눌러 만드세요.\";\n      sel.appendChild(o);\n    }\n    sel.value = lib.currentExam || \"\";\n    $(\"exam-rename\").disabled = $(\"exam-delete\").disabled = !currentExam();\n    renderChips();\n  }\n\n  // 보관함(관리)의 지문 목록: 번호를 누르면 편집 칸에 불러온다.\n  function renderChips() {\n    var box = $(\"chips\");\n    box.textContent = \"\";\n    var exam = currentExam();\n    var list = exam ? sortPassages(exam.passages) : [];\n    $(\"chips-count\").textContent = exam && list.length ? \"지문 \" + list.length + \"개. 번호를 누르면 아래에서 고칠 수 있어요.\" : \"\";\n    if (!list.length) {\n      var e = document.createElement(\"span\");\n      e.className = \"empty-chip\";\n      e.textContent = exam ? \"아직 등록한 지문이 없어요. 아래에 번호와 지문을 넣고 ‘지문 저장’을 누르세요.\" : \"먼저 ‘새 교재’를 눌러 교재를 만드세요.\";\n      box.appendChild(e);\n    }\n    list.forEach(function (p) {\n      var chip = document.createElement(\"span\");\n      chip.className = \"chip plain\" + (editing === p.id ? \" editing\" : \"\");\n      var b = document.createElement(\"button\");\n      b.type = \"button\"; b.textContent = VM.noLabel(p.no);\n      b.title = p.text.slice(0, 80);\n      b.addEventListener(\"click\", function () { editPassage(p.id); });\n      chip.appendChild(b);\n      box.appendChild(chip);\n    });\n    renderPicker();\n  }\n\n  // 문제지에 넣을 지문 고르기: 모든 교재의 지문을 교재별로 묶어 보여 준다.\n  var openGroups = {};\n  function renderPicker() {\n    var box = $(\"picker\");\n    box.textContent = \"\";\n    var withPassages = lib.exams.filter(function (e) { return e.passages.length; });\n    if (!withPassages.length) {\n      var empty = document.createElement(\"p\");\n      empty.className = \"hint\";\n      empty.textContent = \"보관함에 지문을 등록하면 여기에서 고를 수 있어요.\";\n      box.appendChild(empty);\n    }\n    withPassages.forEach(function (exam) {\n      var list = sortPassages(exam.passages);\n      var n = list.filter(function (p) { return checked[p.id]; }).length;\n      var group = document.createElement(\"details\");\n      group.className = \"pick-group\";\n      group.open = openGroups[exam.id] !== undefined ? openGroups[exam.id] : (n > 0 || withPassages.length === 1);\n      group.addEventListener(\"toggle\", function () { openGroups[exam.id] = group.open; });\n      var sum = document.createElement(\"summary\");\n      var all = document.createElement(\"input\");\n      all.type = \"checkbox\"; all.id = \"pick-all-\" + exam.id;\n      all.checked = n === list.length; all.indeterminate = n > 0 && n < list.length;\n      all.setAttribute(\"aria-label\", exam.name + \" 지문 모두 선택\");\n      all.addEventListener(\"click\", function (ev) { ev.stopPropagation(); });\n      all.addEventListener(\"change\", function () {\n        list.forEach(function (p) { if (all.checked) checked[p.id] = true; else delete checked[p.id]; });\n        openGroups[exam.id] = true;\n        saveState(); renderPicker();\n      });\n      var name = document.createElement(\"span\"); name.textContent = exam.name;\n      var cnt = document.createElement(\"span\"); cnt.className = \"n\"; cnt.textContent = n + \" / \" + list.length;\n      sum.append(all, name, cnt);\n      group.appendChild(sum);\n      var chips = document.createElement(\"div\");\n      chips.className = \"chips\";\n      list.forEach(function (p) {\n        var chip = document.createElement(\"label\");\n        chip.className = \"chip\" + (checked[p.id] ? \" checked\" : \"\");\n        chip.title = p.text.slice(0, 80);\n        var cb = document.createElement(\"input\");\n        cb.type = \"checkbox\"; cb.checked = !!checked[p.id]; cb.id = \"pick-\" + p.id;\n        cb.addEventListener(\"change\", function () {\n          if (cb.checked) checked[p.id] = true; else delete checked[p.id];\n          openGroups[exam.id] = true;\n          saveState(); renderPicker();\n        });\n        var t = document.createElement(\"span\");\n        t.className = \"chip-text\"; t.textContent = VM.noLabel(p.no);\n        chip.append(cb, t);\n        chips.appendChild(chip);\n      });\n      group.appendChild(chips);\n      box.appendChild(group);\n    });\n    updateTarget();\n  }\n\n  function editPassage(id) {\n    var exam = currentExam();\n    var p = exam && exam.passages.filter(function (x) { return x.id === id; })[0];\n    editing = p ? p.id : null;\n    $(\"p-no\").value = p ? p.no : \"\";\n    $(\"passage\").value = p ? p.text : \"\";\n    $(\"p-delete\").disabled = !p;\n    renderSentences(); renderChips();\n  }\n\n  function savePassage() {\n    var exam = currentExam();\n    if (!exam) return show($(\"lib-status\"), \"err\", \"먼저 ‘새 교재’를 눌러 교재를 만드세요.\");\n    var no = VM.normalizeNo($(\"p-no\").value);\n    var text = $(\"passage\").value.trim();\n    if (!no) return show($(\"lib-status\"), \"err\", \"지문 번호를 넣어 주세요. 예: 29, 41-42\");\n    if (!text) return show($(\"lib-status\"), \"err\", \"지문을 넣어 주세요.\");\n    var same = exam.passages.filter(function (p) { return p.no === no && p.id !== editing; })[0];\n    var target = exam.passages.filter(function (p) { return p.id === editing; })[0] || same;\n    if (target) {\n      if (same && same !== target) exam.passages = exam.passages.filter(function (p) { return p !== same; });\n      target.no = no; target.text = text;\n    } else {\n      target = { id: uid(), no: no, text: text };\n      exam.passages.push(target);\n    }\n    editing = target.id;\n    saveLib(); renderExams();\n    show($(\"lib-status\"), \"ok\", no + \"번 지문을 저장했어요.\");\n  }\n\n  function deletePassage() {\n    var exam = currentExam();\n    if (!exam || !editing) return;\n    var p = exam.passages.filter(function (x) { return x.id === editing; })[0];\n    exam.passages = exam.passages.filter(function (x) { return x.id !== editing; });\n    delete checked[editing];\n    saveLib(); saveState(); editPassage(null); renderExams();\n    show($(\"lib-status\"), \"ok\", (p ? p.no + \"번 \" : \"\") + \"지문을 지웠어요.\");\n  }\n\n  function openExamForm(kind) {\n    examForm = kind;\n    $(\"exam-form\").hidden = false;\n    $(\"exam-form-label\").textContent = kind === \"new\" ? \"새 교재 이름\" : \"바꿀 이름\";\n    $(\"exam-name\").value = kind === \"rename\" && currentExam() ? currentExam().name : \"\";\n    $(\"exam-name\").focus();\n  }\n\n  function submitExamForm() {\n    var name = $(\"exam-name\").value.trim();\n    if (!name) return $(\"exam-name\").focus();\n    if (examForm === \"new\") {\n      var e = { id: uid(), name: name, passages: [] };\n      lib.exams.push(e);\n      lib.currentExam = e.id;\n      editPassage(null);\n    } else if (currentExam()) {\n      currentExam().name = name;\n    }\n    examForm = null;\n    $(\"exam-form\").hidden = true;\n    saveLib(); renderExams();\n  }\n\n  function deleteExam() {\n    var exam = currentExam();\n    if (!exam) return;\n    lib.exams = lib.exams.filter(function (e) { return e !== exam; });\n    exam.passages.forEach(function (p) { delete checked[p.id]; });\n    saveState();\n    lib.currentExam = lib.exams.length ? lib.exams[0].id : null;\n    $(\"exam-confirm\").hidden = true;\n    saveLib(); editPassage(null); renderExams();\n    show($(\"lib-status\"), \"ok\", \"‘\" + exam.name + \"’ 교재를 지웠어요.\");\n  }\n\n  function bulkAdd() {\n    var exam = currentExam();\n    if (!exam) return show($(\"lib-status\"), \"err\", \"먼저 ‘새 교재’를 눌러 교재를 만드세요.\");\n    var list = VM.parseBulkPassages($(\"bulk\").value);\n    if (!list.length) return show($(\"lib-status\"), \"err\", \"번호 줄([18] 또는 18번)을 찾지 못했어요. 지문마다 번호 줄을 먼저 써 주세요.\");\n    var replaced = 0;\n    list.forEach(function (p) {\n      var old = exam.passages.filter(function (x) { return x.no === p.no; })[0];\n      if (old) { old.text = p.text; replaced++; }\n      else exam.passages.push({ id: uid(), no: p.no, text: p.text });\n    });\n    $(\"bulk\").value = \"\";\n    saveLib(); renderExams();\n    show($(\"lib-status\"), \"ok\", \"지문 \" + list.length + \"개를 등록했어요\" + (replaced ? \" (\" + replaced + \"개는 바꿈)\" : \"\") + \": \" + list.map(function (p) { return p.no; }).join(\", \"));\n  }\n\n  async function exportLib() {\n    var blob = new Blob([JSON.stringify(lib, null, 1)], { type: \"application/json\" });\n    try {\n      var r = await offerFile(\"변형문제 지문 보관함.json\", blob);\n      if (r !== \"declined\") show($(\"lib-status\"), \"ok\", \"보관함을 파일로 저장했어요.\");\n    } catch (e) { show($(\"lib-status\"), \"err\", \"저장에 실패했어요: \" + (e.message || e.code)); }\n  }\n\n  function importLib(file) {\n    var reader = new FileReader();\n    reader.onload = function () {\n      try {\n        var data = JSON.parse(reader.result);\n        if (!data || !Array.isArray(data.exams)) throw new Error(\"보관함 파일이 아니에요.\");\n        var added = 0;\n        data.exams.forEach(function (e) {\n          if (!e || !e.name || !Array.isArray(e.passages)) return;\n          var mine = lib.exams.filter(function (x) { return x.name === e.name; })[0];\n          if (!mine) { mine = { id: uid(), name: e.name, passages: [] }; lib.exams.push(mine); }\n          e.passages.forEach(function (p) {\n            if (!p || !p.no || !p.text) return;\n            var old = mine.passages.filter(function (x) { return x.no === p.no; })[0];\n            if (old) old.text = p.text; else mine.passages.push({ id: uid(), no: String(p.no), text: String(p.text) });\n            added++;\n          });\n        });\n        if (!lib.currentExam && lib.exams.length) lib.currentExam = lib.exams[0].id;\n        saveLib(); renderExams();\n        show($(\"lib-status\"), \"ok\", \"지문 \" + added + \"개를 불러왔어요.\");\n      } catch (err) { show($(\"lib-status\"), \"err\", \"불러오지 못했어요: \" + err.message); }\n    };\n    reader.readAsText(file);\n  }\n\n  // ---------- 지문 확인 ----------\n\n  function renderSentences() {\n    var list = VM.splitSentences($(\"passage\").value, $(\"by-line\").checked);\n    $(\"sent-summary\").textContent = \"문장 나누기 확인 (\" + list.length + \"문장)\";\n    var ol = $(\"sentences\");\n    ol.textContent = \"\";\n    list.forEach(function (s) { var li = document.createElement(\"li\"); li.textContent = s; ol.appendChild(li); });\n  }\n\n  // ---------- 유형 선택 ----------\n\n  function renderTypes() {\n    var box = $(\"types\");\n    box.textContent = \"\";\n    VM.TYPES.forEach(function (t) {\n      var sel = state.selection[t.key] || { on: false, count: 1 };\n      var row = document.createElement(\"label\");\n      row.className = \"type\" + (sel.on ? \" on\" : \"\");\n      var cb = document.createElement(\"input\");\n      cb.type = \"checkbox\"; cb.id = \"type-\" + t.key; cb.checked = sel.on;\n      var name = document.createElement(\"span\");\n      name.textContent = t.name;\n      var tag = document.createElement(\"span\");\n      tag.className = \"tag \" + t.mode; tag.textContent = t.mode === \"auto\" ? \"자동\" : \"AI\";\n      name.appendChild(tag);\n      var num = document.createElement(\"input\");\n      num.type = \"number\"; num.min = \"1\"; num.max = \"5\"; num.value = sel.count; num.id = \"count-\" + t.key;\n      num.setAttribute(\"aria-label\", t.name + \" 문제 수\");\n      cb.addEventListener(\"change\", function () { setSel(t.key, cb.checked, num.value); row.classList.toggle(\"on\", cb.checked); });\n      num.addEventListener(\"input\", function () {\n        if (!cb.checked) { cb.checked = true; row.classList.add(\"on\"); }\n        setSel(t.key, true, num.value);\n      });\n      row.append(cb, name, num);\n      box.appendChild(row);\n    });\n  }\n\n  function setSel(key, on, count) {\n    state.selection[key] = { on: on, count: Math.max(1, Math.min(5, parseInt(count, 10) || 1)) };\n    saveState(); updateTarget();\n  }\n\n  function selectedTypes() {\n    return VM.TYPES.filter(function (t) { return state.selection[t.key] && state.selection[t.key].on; })\n      .map(function (t) { return { type: t.key, count: state.selection[t.key].count, mode: t.mode, name: t.name }; });\n  }\n\n  // 문제를 만들 지문: 고르기에서 체크한 지문(모든 교재), 없으면 편집 칸의 지문\n  function targetPassages() {\n    var list = [];\n    lib.exams.forEach(function (e) {\n      sortPassages(e.passages).forEach(function (p) {\n        if (checked[p.id]) list.push({ id: p.id, exam: e.name, no: p.no, text: p.text });\n      });\n    });\n    if (list.length) return { passages: list, fromLibrary: true };\n    // 고른 지문이 없을 때는 보관함에 저장하지 않은 새 지문(편집 칸)으로만 만든다.\n    var text = $(\"passage\").value.trim();\n    if (!text || editing) return { passages: [] };\n    var exam = currentExam();\n    return { passages: [{ exam: exam ? exam.name : \"\", no: VM.normalizeNo($(\"p-no\").value), text: text }], fromLibrary: false };\n  }\n\n  function updateTarget() {\n    var t = targetPassages();\n    var per = selectedTypes().reduce(function (s, x) { return s + x.count; }, 0);\n    var groups = [], byExam = {};\n    t.passages.forEach(function (p) {\n      if (!byExam[p.exam]) { byExam[p.exam] = []; groups.push(p.exam); }\n      byExam[p.exam].push(p.no ? VM.noLabel(p.no) : \"편집 중인 지문\");\n    });\n    var summary = groups.map(function (g) { return (g ? g + \": \" : \"\") + byExam[g].join(\", \"); }).join(\" / \");\n    $(\"pick-count\").textContent = t.fromLibrary ? \"선택한 지문 \" + t.passages.length + \"개\" : \"고른 지문이 없어요.\";\n    $(\"make-target\").textContent = t.passages.length\n      ? \"대상: \" + summary + \" · 약 \" + (per * t.passages.length) + \"문제\"\n      : \"2번 칸에서 문제를 만들 지문을 골라 주세요.\";\n  }\n\n  // ---------- 만들기 ----------\n\n  function srcOf(exam, p) { return p.no ? { exam: exam, no: p.no } : null; }\n\n  // 문제는 늘 유형 순서대로 묶고, 같은 유형 안에서는 회차 → 지문 순서(교재 순서 → 지문 번호 순서)로 놓는다.\n  // '회차별로 나누기'를 켜면 회차 → 유형 → 지문 순서.\n  function sortAll() {\n    var rank = {}, n = 0;\n    lib.exams.forEach(function (e) {\n      sortPassages(e.passages).forEach(function (p) { rank[e.name + \"\\u0001\" + p.no] = n++; });\n    });\n    state.problems = VM.sortProblems(state.problems, function (src) {\n      var r = rank[(src.exam || \"\") + \"\\u0001\" + src.no];\n      return r === undefined ? null : r;\n    }, !!state.options.rounds);\n  }\n\n  // 새 문제를 넣고 정렬한 뒤, 새 문제의 정답 번호를 문제지 전체에서 ①~⑤가 고르게 되도록 맞춘다.\n  // 같은 지문(교재·번호)·같은 유형으로 이미 만든 문제들: 새 회차 문제가 이것들과 겹치지 않게 한다.\n  function existingFor(passage, type) {\n    if (!passage || !passage.no) return [];\n    return state.problems.filter(function (q) {\n      return q.type === type && q.source && q.source.no === passage.no && (q.source.exam || \"\") === (passage.exam || \"\");\n    });\n  }\n\n  function insertProblems(list) {\n    list.forEach(function (p) { if (!p.id) p.id = uid(); if (!VM.needsReview(p)) p.reviewed = true; });\n    state.problems = state.problems.concat(list);\n    sortAll();\n    VM.balanceAnswers(state.problems, function (p) { return list.indexOf(p) >= 0; });\n  }\n\n  function rebalanceAll() {\n    sortAll();\n    VM.balanceAnswers(state.problems);\n    saveState(); renderPages();\n    show($(\"save-status\"), \"ok\", \"정답 번호를 다시 맞췄어요: \" + answerSummary() + \". 어법·어휘처럼 지문 속에 번호가 있는 문제와 서술형은 그대로 두었어요.\");\n  }\n\n  function answerSummary() {\n    return VM.answerCounts(state.problems).map(function (n, i) { return VM.CIRCLED[i] + n; }).join(\" \");\n  }\n\n  function make() {\n    var target = targetPassages();\n    var types = selectedTypes();\n    if (!target.passages.length) return show($(\"status\"), \"err\", \"2번 칸 ‘문제지에 넣을 지문 고르기’에서 지문을 골라 주세요. 교재 이름 옆 체크박스로 한 번에 고를 수 있어요.\");\n    if (!types.length) return show($(\"status\"), \"err\", \"만들 유형을 하나 이상 골라 주세요.\");\n\n    var rng = VM.makeRng();\n    var byLine = $(\"by-line\").checked && !target.fromLibrary;\n    var made = 0, errors = [];\n    var decks = {}; // 유형마다 정답 번호 뽑개 하나를 모든 지문이 함께 쓴다\n    target.passages.forEach(function (p) {\n      var sents = VM.splitSentences(p.text, byLine);\n      types.filter(function (t) { return t.mode === \"auto\"; }).forEach(function (t) {\n        try {\n          decks[t.type] = decks[t.type] || VM.answerDeck(rng);\n          var ps = VM.AUTO_MAKERS[t.type](sents, t.count, rng, decks[t.type], existingFor(p, t.type));\n          ps.forEach(function (x) { x.source = srcOf(p.exam, p); });\n          insertProblems(ps);\n          made += ps.length;\n        } catch (e) { errors.push((p.no ? p.no + \"번 \" : \"\") + t.name + \": \" + e.message); }\n      });\n    });\n    if (made) { saveState(); renderPages(); }\n\n    var ai = types.filter(function (t) { return t.mode === \"ai\"; });\n    var prefix = [];\n    if (made) prefix.push(\"자동 유형 \" + made + \"문제를 추가했어요.\");\n    if (errors.length) prefix.push(errors.join(\" \"));\n    show($(\"status\"), errors.length ? \"warn\" : \"ok\", prefix.join(\" \"));\n    lastTarget = { passages: target.passages, types: types };\n    renderCoverage();\n    if (!ai.length) { $(\"manual\").hidden = true; return; }\n\n    pendingCtx = target;\n    renderPrompts(target, ai);\n    if (sampleFn) {\n      $(\"manual\").hidden = true;\n      runAi(target, ai, prefix);\n    } else {\n      $(\"manual\").hidden = false;\n      show($(\"status\"), errors.length ? \"warn\" : \"ok\", prefix.concat([\"AI 유형은 아래 순서대로 진행해 주세요.\"]).join(\" \"));\n    }\n  }\n\n  // ---------- 검수(더블체크) ----------\n\n  function originalText(src) {\n    if (!src) return \"\";\n    var e = lib.exams.filter(function (x) { return x.name === src.exam; })[0];\n    var p = e && e.passages.filter(function (x) { return x.no === src.no; })[0];\n    return p ? p.text : \"\";\n  }\n\n  function snapshot(p) { return JSON.stringify([p.answer, p.choices, p.passage]); }\n\n  // 검수로 내용이 바뀐 문제만 정답 번호를 다시 맞춘다.\n  function afterReview(problems, before) {\n    var changed = problems.filter(function (p, i) { return snapshot(p) !== before[i]; });\n    if (changed.length) VM.balanceAnswers(state.problems, function (p) { return changed.indexOf(p) >= 0; });\n  }\n\n  async function reviewWithSample(problems, signal) {\n    var items = problems.filter(VM.needsReview).map(function (p, k) { return { id: \"r\" + (k + 1), problem: p, original: originalText(p.source) }; });\n    if (!items.length) return null;\n    var byId = {};\n    items.forEach(function (it) { byId[it.id] = it.problem; });\n    var data = await sampleFn.json(VM.buildReviewPrompt(items), { signal: signal });\n    return VM.applyReview(data, byId);\n  }\n\n  function pendingReview() {\n    return state.problems.filter(function (p) { return VM.needsReview(p) && !p.reviewed; });\n  }\n\n  // Claude 화면 안: 검수 안 된 AI 문제를 모아 다시 검수한다.\n  async function runReview() {\n    var pending = pendingReview();\n    if (!pending.length) return show($(\"status\"), \"ok\", \"검수할 문제가 없어요. 모두 검수했어요.\");\n    var before = state.problems.map(snapshot);\n    var all = state.problems.slice();\n    $(\"review-run\").disabled = true;\n    var fixed = 0, failed = 0;\n    for (var i = 0; i < pending.length; i += REVIEW_CHUNK) {\n      aborter = new AbortController();\n      show($(\"status\"), \"\", \"AI가 문제를 검수하는 중이에요 (\" + Math.min(i + REVIEW_CHUNK, pending.length) + \"/\" + pending.length + \").\");\n      try {\n        var r = await reviewWithSample(pending.slice(i, i + REVIEW_CHUNK), aborter.signal);\n        if (r) fixed += r.fixed;\n      } catch (e) { failed++; if (e && e.code === \"cancelled\") break; }\n    }\n    aborter = null;\n    afterReview(all, before);\n    saveState(); renderPages(); renderCoverage();\n    $(\"review-run\").disabled = false;\n    show($(\"status\"), failed ? \"warn\" : \"ok\", \"검수를 마쳤어요. 고친 문제 \" + fixed + \"개.\" + (failed ? \" 일부는 검수하지 못했어요. 다시 눌러 주세요.\" : \"\"));\n  }\n\n  // 파일로 열었을 때: 검수 요청문을 만들고, 답변을 붙여 넣어 반영한다.\n  var reviewMap = {};\n  var REVIEW_CHUNK = 6;\n  function renderReviewPrompts() {\n    var box = $(\"review-prompts\");\n    box.textContent = \"\";\n    reviewMap = {};\n    var pending = pendingReview();\n    $(\"review-box\").hidden = !pending.length || !!sampleFn;\n    $(\"review-run\").hidden = !sampleFn || !pending.length;\n    if (!pending.length || sampleFn) return;\n    var total = Math.ceil(pending.length / REVIEW_CHUNK);\n    for (var i = 0; i < pending.length; i += REVIEW_CHUNK) {\n      var items = pending.slice(i, i + REVIEW_CHUNK).map(function (p, k) {\n        var id = \"r\" + (i + k + 1);\n        reviewMap[id] = p;\n        return { id: id, problem: p, original: originalText(p.source) };\n      });\n      var row = document.createElement(\"div\");\n      row.className = \"prompt-item\";\n      var b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.textContent = \"④ 검수 요청문 \" + (total > 1 ? (i / REVIEW_CHUNK + 1) + \"/\" + total + \" \" : \"\") + \"복사\";\n      var note = document.createElement(\"span\");\n      note.className = \"hint\";\n      b.addEventListener(\"click\", copier(VM.buildReviewPrompt(items), note));\n      row.append(b, note);\n      box.appendChild(row);\n    }\n  }\n\n  function loadReview() {\n    var text = $(\"review-in\").value.trim();\n    if (!text) return show($(\"status\"), \"err\", \"Claude의 검수 답변을 먼저 붙여 넣어 주세요.\");\n    try {\n      var before = state.problems.map(snapshot), all = state.problems.slice();\n      var r = VM.applyReview(text, reviewMap);\n      afterReview(all, before);\n      saveState(); renderPages();\n      $(\"review-in\").value = \"\";\n      show($(\"status\"), \"ok\", \"검수 결과를 반영했어요: \" + r.checked + \"문제 확인, \" + r.fixed + \"문제 고침.\");\n      renderCoverage(); renderReviewPrompts();\n    } catch (e) { show($(\"status\"), \"err\", e.message); }\n  }\n\n  // 화면·파일에 나오는 문항 번호 (회차를 나누면 회차마다 1부터)\n  function displayNumbers() {\n    var byRound = state.options.rounds && state.problems.some(function (p) { return p.round > 0; });\n    var n = 0, last = null;\n    return state.problems.map(function (p) {\n      var r = p.round || 0;\n      if (byRound && r !== last) { n = 0; last = r; }\n      n++;\n      return byRound ? (r + 1) + \"회차 \" + n + \"번\" : n + \"번\";\n    });\n  }\n\n  // 점검 칸 아래쪽: 검수 결과, 형식 검사, 앞뒤 정답 겹침\n  function renderQuality(box) {\n    if (!state.problems.length) return;\n    var nums = displayNumbers();\n    var head = document.createElement(\"p\");\n    head.className = \"cov-title\";\n    head.textContent = \"검수(더블체크)\";\n    box.appendChild(head);\n    function row(ok, label, text) {\n      var r = document.createElement(\"p\");\n      r.className = \"cov-row \" + (ok ? \"done\" : \"miss\");\n      var b = document.createElement(\"b\"); b.textContent = label;\n      var t = document.createElement(\"span\"); t.textContent = \" \" + text;\n      r.append(b, t);\n      box.appendChild(r);\n    }\n    var ai = state.problems.filter(VM.needsReview);\n    var pend = ai.filter(function (p) { return !p.reviewed; });\n    var notes = [];\n    state.problems.forEach(function (p, i) { if (p.reviewNote) notes.push(nums[i] + \" \" + p.reviewNote); });\n    if (ai.length) row(!pend.length, \"AI 검수\", (ai.length - pend.length) + \"/\" + ai.length + \" 완료\" + (pend.length ? \" · 남은 문제는 \" + (sampleFn ? \"‘AI로 검수하기’\" : \"④ 검수 요청문\") + \"으로 확인하세요\" : \"\") + (notes.length ? \" · 고친 곳: \" + notes.join(\" / \") : \"\"));\n    var bad = [];\n    state.problems.forEach(function (p, i) { var is = VM.checkProblem(p, originalText(p.source)); if (is.length) bad.push(nums[i] + \" \" + is.join(\", \")); });\n    row(!bad.length, \"형식 검사\", bad.length ? bad.join(\" / \") : \"선지 중복·빈 선지·밑줄 번호·정답 위치 이상 없음\");\n    var dup = [];\n    for (var i = 1; i < state.problems.length; i++) {\n      var a = state.problems[i].answer;\n      if (VM.CIRCLED.indexOf(a) >= 0 && a === state.problems[i - 1].answer) dup.push(nums[i - 1] + \"·\" + nums[i] + \"(\" + a + \")\");\n    }\n    var same = VM.findDuplicates(state.problems).map(function (pr) { return nums[pr[0]] + \"·\" + nums[pr[1]]; });\n    row(!same.length, \"회차 중복\", same.length ? \"같은 지문·유형에서 내용이 같은 문제: \" + same.join(\", \") + \" · 한쪽을 삭제하고 다시 만드세요\" : \"같은 지문·유형의 문제끼리 겹치는 것이 없어요\");\n    row(!dup.length, \"정답 겹침\", dup.length ? \"앞뒤 문제 정답이 같은 곳: \" + dup.join(\", \") + \" · ‘정답 번호 고르게’를 누르거나, 어법·어휘라면 그 문제를 다시 만드세요\" : \"앞뒤 문제의 정답이 같은 곳이 없어요\");\n  }\n\n  // 빠진 문제 점검: 마지막으로 만든 지문 × 유형 × 개수가 문제지에 다 있는지 센다.\n  function renderCoverage() {\n    var box = $(\"coverage\");\n    box.textContent = \"\";\n    if (!lastTarget || !lastTarget.passages.length) {\n      renderQuality(box);\n      box.hidden = !state.problems.length;\n      return;\n    }\n    var have = {};\n    state.problems.forEach(function (p) {\n      if (!p.source) return;\n      var k = p.type + \"\\u0001\" + (p.source.exam || \"\") + \"\\u0001\" + p.source.no;\n      have[k] = (have[k] || 0) + 1;\n    });\n    var complete = true;\n    var title = document.createElement(\"p\");\n    title.className = \"cov-title\";\n    box.appendChild(title);\n    lastTarget.types.forEach(function (t) {\n      var missing = [];\n      lastTarget.passages.forEach(function (p) {\n        var got = have[t.type + \"\\u0001\" + (p.exam || \"\") + \"\\u0001\" + p.no] || 0;\n        if (got < t.count) missing.push(VM.noLabel(p.no) + (t.count > 1 ? \"(\" + got + \"/\" + t.count + \")\" : \"\"));\n      });\n      var row = document.createElement(\"p\");\n      row.className = \"cov-row \" + (missing.length ? \"miss\" : \"done\");\n      var name = document.createElement(\"b\");\n      name.textContent = t.name;\n      var info = document.createElement(\"span\");\n      var done = lastTarget.passages.length - missing.length;\n      info.textContent = \" 지문 \" + done + \"/\" + lastTarget.passages.length + (missing.length ? \" · 빠짐: \" + missing.join(\", \") : \" · 모두 있음\");\n      row.append(name, info);\n      box.appendChild(row);\n      if (missing.length) complete = false;\n    });\n    title.textContent = complete\n      ? \"점검: 고른 지문 \" + lastTarget.passages.length + \"개 × 유형 \" + lastTarget.types.length + \"개가 모두 들어 있어요.\"\n      : \"점검: 아직 문제가 없는 지문이 있어요. AI 유형이면 나머지 요청문도 보내고 답변을 불러오세요.\";\n    renderQuality(box);\n    box.hidden = false;\n  }\n\n  // 어법·어휘의 정답 번호를 미리 정한다. 유형마다 ①~⑤를 섞어 한 바퀴씩 쓰므로 전체에서 고르게 나온다.\n  function answerTargets(decks, type, count) {\n    if (!VM.FIXED_ANSWER_TYPES[type]) return null;\n    decks[type] = decks[type] || VM.answerDeck(VM.makeRng());\n    var out = [];\n    while (out.length < count) {\n      var x = decks[type]();\n      if (out.indexOf(x) < 0 || out.length >= 5) out.push(x);\n    }\n    return out;\n  }\n\n  // 요청문에는 지문마다 1, 2, 3… 번호를 붙이고, 답변을 읽을 때 원래 교재·번호로 되돌린다.\n  function renderPrompts(target, ai) {\n    var box = $(\"prompts\");\n    box.textContent = \"\";\n    var reqs = ai.map(function (a) { return { type: a.type, count: a.count }; });\n    var promptDecks = {};\n    target.keyMap = {};\n    var keyed = target.passages.map(function (p, i) {\n      var key = String(i + 1);\n      target.keyMap[key] = p;\n      return { no: key, text: p.text, label: (p.exam ? p.exam + \" \" : \"\") + (p.no ? VM.noLabel(p.no) : \"\") };\n    });\n    for (var i = 0; i < keyed.length; i += PROMPT_PASSAGES) {\n      var chunk = keyed.slice(i, i + PROMPT_PASSAGES);\n      var plan = { __avoid: {} };\n      reqs.forEach(function (r) {\n        chunk.forEach(function (p) {\n          var notes = existingFor(target.keyMap[p.no], r.type).map(VM.avoidNote);\n          if (notes.length) (plan.__avoid[r.type] = plan.__avoid[r.type] || {})[p.no] = notes;\n        });\n      });\n      reqs.forEach(function (r) {\n        chunk.forEach(function (p) {\n          var want = answerTargets(promptDecks, r.type, r.count);\n          if (want) (plan[r.type] = plan[r.type] || {})[p.no] = want;\n        });\n      });\n      var text = VM.buildCombinedPrompt(chunk, reqs, plan);\n      var row = document.createElement(\"div\");\n      row.className = \"prompt-item\";\n      var b = document.cr eaderLeft || L.headerRight) {\n      var h = document.createElement(\"div\");\n      h.className = \"p-header\";\n      var hl = document.createElement(\"span\"); hl.textContent = L.headerLeft || \"\";\n      var hr = document.createElement(\"span\"); hr.textContent = L.headerRight || \"\";\n      h.append(hl, hr);\n      page.appendChild(h);\n    }\n    if (headBlocks) {\n      var top = document.createElement(\"div\");\n      top.className = \"p-top\";\n      headBlocks.forEach(function (bl) { top.appendChild(blockEl(bl)); });\n      page.appendChild(top);\n    }\n    curFull = document.createElement(\"div\");\n    curFull.className = \"p-full\";\n    page.appendChild(curFull);\n    curPage = page;\n    var body = document.createElement(\"div\");\n    var two = state.options.columns !== 1;\n    body.className = \"p-body\" + (two ? \" two\" : \"\");\n    var cols = [];\n    for (var c = 0; c < (two ? 2 : 1); c++) {\n      var col = document.createElement(\"div\");\n      col.className = \"col\";\n      body.appendChild(col); cols.push(col);\n    }\n    page.appendChild(body);\n    var f = document.createElement(\"div\");\n    f.className = \"p-footer\";\n    var fl = document.createElement(\"span\"); fl.textContent = L.footerLeft || \"\";\n    var fc = document.createElement(\"span\"); fc.textContent = String(pageNo);\n    var fr = document.createElement(\"span\"); fr.textContent = L.footerRight || \"\";\n    f.append(fl, fc, fr);\n    page.appendChild(f);\n    pagesEl.appendChild(page);\n    return cols;\n  }\n\n  function overflows(col) { return col.scrollHeight > col.clientHeight + 1; }\n\n  function renderPages() {\n    var pagesEl = $(\"pages\");\n    pagesEl.textContent = \"\";\n    sortAll(); // 예전에 만든 문제나 지문 번호를 바꾼 경우에도 순서를 맞춘다\n    $(\"count\").textContent = state.problems.length + \"문제\" + (state.problems.length ? \" · 정답 \" + answerSummary() : \"\");\n    var blocks = VM.buildBlocks(docModel());\n    var pageNo = 1;\n    var cols = makePage(pagesEl, page Col(); col = cols[ci]; col.appendChild(el); }\n      });\n    });\n    fitPages();\n  }\n\n  function fitPages() {\n    var wrap = $(\"pages-scroll\"), pagesEl = $(\"pages\");\n    var s = Math.min(1, wrap.clientWidth / 794);\n    pagesEl.style.transform = s < 1 ? \"scale(\" + s + \")\" : \"\";\n    wrap.style.height = s < 1 ? Math.ceil(pagesEl.offsetHeight * s) + \"px\" : \"\";\n  }\n\n  function problemTools(i) {\n    var box = document.createElement(\"span\");\n    box.className = \"tools\";\n    var del = document.createElement(\"button\");\n    del.type = \"button\"; del.textContent = \"삭제\"; del.title = (i + 1) + \"번 삭제\";\n    del.addEventListener(\"click\", function () { state.problems.splice(i, 1); saveState(); renderPages(); renderCoverage(); renderReviewPrompts(); });\n    box.appendChild(del);\n    return box;\n  }\n\n  // ---------- 파일 저장 ----------\n\n  function fileBase() {\n    return (state.layout.title || \"영어 변형문제\").replace(/[\\\\/:*?\"<>|]+/g, \" \").trim() || \"영어 변형문제\";\n  }\n\n  function plainDownload(name, blob) {\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement(\"a\");\n    a.href = url; a.download = name;\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);\n  }\n\n  // Claude 화면 안에서는 저장 확인창을 거친다. 그 밖에서는 바로 내려받는다.\n  async function offerFile(name, blob) {\n    if (!downloadsCap) { plainDownload(name, blob); return \"saved\"; }\n    try {\n      await downloadsCap.save({ filename: name, data: blob });\n      return \"saved\";\n    } catch (e) {\n      if (e && e.code === \"declined\") return \"declined\";\n      throw e;\n    }\n  }\n\n  // Claude 화면 안에서는 .hwpx 저장이 막혀 있어, 한글에서 바로 열리는 .docx로 저장한다.\n  function hangulFormat() { return downloadsCap ? \"docx\" : \"hwpx\"; }\n\n  function updateSaveHint() {\n    $(\"save-hint\").textContent = hangulFormat() === \"docx\"\n      ? \"이 화면에서는 한글 파일을 .docx 형식으로 저장해요. 한글에서 바로 열리고, 한글의 [다른 이름으로 저장]에서 HWP ed = loadJson(STATE_KEY);\n    var savedLib = loadJson(LIB_KEY);\n    if (savedLib && Array.isArray(savedLib.exams)) lib = savedLib;\n    if (saved) {\n      state.problems = saved.problems || [];\n      state.selection = saved.selection || {};\n      Object.assign(state.layout, saved.layout || {});\n      Object.assign(state.options, saved.options || {});\n      checked = saved.checked || {};\n      $(\"by-line\").checked = !!saved.byLine;\n    } else if (!savedLib) {\n      seedExample();\n      saveLib(); saveState();\n    }\n\n    Object.keys(LAYOUT_FIELDS).forEach(function (id) {\n      var key = LAYOUT_FIELDS[id];\n      $(id).value = state.layout[key] || \"\";\n      $(id).addEventListener(\"input\", function () { state.layout[key] = $(id).value; saveState(); renderPages(); });\n    });\n    $(\"opt-name\").checked = state.layout.showName !== false;\n    $(\"opt-cols\").checked = state.options.columns !== 1;\n    $(\"opt-answers\").checked = state.options.answers !== false;\n    $(\"opt-expl\").checked = state.options.explanations !== false;\n    $(\"opt-rounds\").checked = !!state.options.rounds;\n    $(\"opt-typemark\").value = state.options.typeMark || \"tag\";\n    $(\"opt-typemark\").addEventListener(\"change\", function () { state.options.typeMark = $(\"opt-typemark\").value; saveState(); renderPages(); });\n    $(\"opt-rounds\").addEventListener(\"change\", function () { state.options.rounds = $(\"opt-rounds\").checked; saveState(); renderPages(); });\n    $(\"opt-name\").addEventListener(\"change\", function () { state.layout.showName = $(\"opt-name\").checked; saveState(); renderPages(); });\n    $(\"opt-cols\").addEventListener(\"change\", function () { state.options.columns = $(\"opt-cols\").checked ? 2 : 1; saveState(); renderPages(); });\n    $(\"opt-answers\").addEventListener(\"change\", function () { state.options.answers = $(\"opt-answers\").checked; saveState(); renderPages(); });\n    $(\"opt-expl\").addEventListener(\"change\", function () { state.options.explanations = $(\"opt-expl\").checked; saveState(); renderPages(); });\n\n    updateSaveHint();\n    renderTypes();\n    renderExams();\n    var exam = currentExam();\n    editPassage(exam && exam.passages.length ? sortPassages(exam.passages)[0].id : null);\n    renderPages();\n    if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPages);\n    window.addEventListener(\"resize\", fitPages);\n    // 워크북 메이커가 같은 보관함을 바꾸면(다른 탭, 또는 영어 메이커의 워크북 탭) 다시 읽는다.\n    window.addEventListener(\"storage\", function (e) {\n      if (e.key !== LIB_KEY) return;\n      var fresh = loadJson(LIB_KEY);\n      if (fresh && Array.isArray(fresh.exams)) { lib = fresh; renderExams(); }\n    });\n    renderCoverage();\n    renderReviewPrompts();\n\n    $(\"exam\").addEventListener(\"change\", function () { lib.currentExam = $(\"exam\").value || null; saveLib(); editPassage(null); renderExams(); });\n    $(\"exam-new\").addEventListener(\"click\", function () { openExamForm(\"new\"); });\n    $(\"exam-rename\").addEventListener(\"click\", function () { openExamForm(\"rename\"); });\n    $(\"exam-save\").addEventListener(\"click\", submitExamForm);\n    $(\"exam-name\").addEventListener(\"keydown\", function (e) { if (e.key === \"Enter\") submitExamForm(); });\n    $(\"exam-cancel\").addEventListener(\"click\", function () { $(\"exam-form\").hidden = true; });\n    $(\"exam-delete\").addEventListener(\"click\", function () {\n      var ex = currentExam(); if (!ex) return;\n      $(\"exam-confirm-text\").textContent = \"‘\" + ex.name + \"’ 교재와 지문 \" + ex.passages.length + \"개를 지울까요? \";\n      $(\"exam-confirm\").hidden = false;\n    });\n    $(\"exam-confirm-yes\").addEventListener(\"click\", deleteExam);\n    $(\"exam-confirm-no\").addEventListener(\"click\", function () { $(\"exam-confirm\").hidden = true; });\n    $(\"pick-none\").addEventListener(\"click\", function () { checked = {}; saveState(); renderPicker(); });\n    $(\"p-save\").addEventListe
